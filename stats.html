        /* ---------- DÉCLENCHEURS — NOUVELLE SECTION ---------- */

        function renderTriggersSection(stats) {
            var html = '<div class="section-tag">Déclencheurs</div>';

            if (!stats.triggerStats.length) {
                html += '<div class="stat-card" style="padding:12px"><div class="no-data">Aucune donnée</div></div>';
                return html;
            }

            /* Podium catégories */
            var catFreq = {};
            for (var i = 0; i < stats.triggerStats.length; i++) {
                var tname = stats.triggerStats[i].name;
                var cat = tname.indexOf(' — ') !== -1 ? tname.split(' — ')[0] : 'Divers';
                catFreq[cat] = (catFreq[cat] || 0) + stats.triggerStats[i].count;
            }
            var catArr = [];
            for (var k in catFreq) catArr.push({ name: k, count: catFreq[k] });
            catArr.sort(function(a, b) { return b.count - a.count; });
            html += '<div class="stat-card" style="padding:12px 12px 8px">';
            html += '<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--dark);opacity:0.45;margin-bottom:10px">Catégories</div>';

            if (catArr.length) {
                var maxCatCount = catArr[0].count;
                html += '<div class="rank-list">';
                for (var ci = 0; ci < catArr.length; ci++) {
                    var bp = Math.round((catArr[ci].count / maxCatCount) * 100);
                    html += '<div class="rank-item">' +
                        '<div class="rank-number">' + (ci + 1) + '</div>' +
                        '<div class="rank-bar-wrap">' +
                        '<div class="rank-header"><div class="rank-name">' + catArr[ci].name + '</div>' +
                        '<div class="rank-meta">' + catArr[ci].count + '×</div></div>' +
                        '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + bp + '%"></div></div>' +
                        '</div></div>';
                }
                html += '</div>';
            }

            /* Séparateur + liste avec toggle */
            html += '<div style="border-top:1px solid rgba(46,58,89,0.1);margin:10px -12px 10px;"></div>';
            var isFreq = viewModes.triggers !== 'intensity';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
                '<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--dark);opacity:0.45">Déclencheurs</div>' +
                '<div class="view-toggle">' +
                '<button class="view-toggle-btn ' + (isFreq ? 'active' : '') + '" data-view-id="triggers" data-view-mode="freq">Fréquence</button>' +
                '<button class="view-toggle-btn ' + (!isFreq ? 'active' : '') + '" data-view-id="triggers" data-view-mode="intensity">Intensité</button>' +
                '</div></div>';

            var sorted = stats.triggerStats.slice();
            if (!isFreq) {
                sorted = sorted.filter(function(t) { return t.avgIntensity !== null; });
                sorted.sort(function(a, b) { return b.avgIntensity - a.avgIntensity; });
            }

            var top3 = sorted.slice(0, 3);
            var rest = sorted.slice(3);
            var maxVal = isFreq ? (top3.length ? top3[0].count : 1) : 10;

            html += '<div class="rank-list">';
            for (var ti = 0; ti < top3.length; ti++) {
                var t = top3[ti];
                var val = isFreq ? t.count : t.avgIntensity;
                var bpct = Math.round((val / maxVal) * 100);
                var meta = isFreq ? (t.count + '×') : (t.avgIntensity + '/10');
                html += '<div class="rank-item">' +
                    '<div class="rank-number">' + (ti + 1) + '</div>' +
                    '<div class="rank-bar-wrap">' +
                    '<div class="rank-header"><div class="rank-name">' + t.name + '</div>' +
                    '<div class="rank-meta">' + meta + '</div></div>' +
                    '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + bpct + '%"></div></div>' +
                    '</div></div>';
            }
            html += '</div>';

            if (rest.length > 0) {
                var maxAll = isFreq ? sorted[0].count : 10;
                var accId = 'acc_triggers';
                var accOpen = viewModes.triggersAccOpen;
                html += '<button class="accordion-toggle" data-acc-id="' + accId + '">' +
                    '<span>Voir les ' + rest.length + ' autre' + (rest.length > 1 ? 's' : '') + '</span>' +
                    '<span id="arr_' + accId + '">' + (accOpen ? '▴' : '▾') + '</span></button>';
                html += '<div class="accordion-body' + (accOpen ? ' open' : '') + '" id="' + accId + '"><div class="all-rank-list">';
                for (var ri = 0; ri < rest.length; ri++) {
                    var rt = rest[ri];
                    var rv = isFreq ? rt.count : rt.avgIntensity;
                    var rbp = Math.round((rv / maxAll) * 100);
                    var rm = isFreq ? (rt.count + '×') : (rt.avgIntensity + '/10');
                    html += '<div class="rank-item">' +
                        '<div class="rank-number secondary">·</div>' +
                        '<div class="rank-bar-wrap">' +
                        '<div class="rank-header"><div class="rank-name">' + rt.name + '</div>' +
                        '<div class="rank-meta">' + rm + '</div></div>' +
                        '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + rbp + '%"></div></div>' +
                        '</div></div>';
                }
                html += '</div></div>';
            }

            html += '</div>';
            return html;
        }

        function matchesFilters(entry) {
            if (activeFilters.contexte.length && activeFilters.contexte.indexOf(entry.profil || 'commun') === -1) return false;
            if (activeFilters.origine.length && activeFilters.origine.indexOf(entry.typeCrise || '') === -1) return false;
            if (activeFilters.type.length && activeFilters.type.indexOf(entry.typeManifestation || '') === -1) return false;
            var int = parseFloat(entry.intensite);
            if (!isNaN(int) && (int < activeFilters.intMin || int > activeFilters.intMax)) return false;
            if (activeFilters.moment.length) {
                var h = new Date(entry.horodatage).getHours();
                var slot = h < 6 ? 'nuit' : h < 12 ? 'matin' : h < 18 ? 'aprem' : 'soir';
                if (activeFilters.moment.indexOf(slot) === -1) return false;
            }
            return true;
        }

        /* ---------- INSIGHTS ---------- */

        function buildInsights(stats, days, from, to) {
            var insights = [];

            /* Règle G — Variation vs période précédente */
            if (stats.prev && stats.prev.count >= 3 && stats.total >= 3) {
                var pctVar = Math.round(((stats.total - stats.prev.count) / stats.prev.count) * 100);
                if (Math.abs(pctVar) >= 20) {
                    var dir = pctVar > 0 ? 'augmenté' : 'diminué';
                    insights.push({ priority: 1, icon: pctVar > 0 ? '⬆️' : '⬇️',
                        text: 'Le nombre de crises a <strong>' + dir + ' de ' + Math.abs(pctVar) + '%</strong> par rapport à la période précédente.' });
                }
            }

            /* Règle F — Énergie basse → crises plus intenses */
            if (stats.thresholds && stats.thresholds.energie) {
                var enLow = stats.thresholds.energie[0];
                if (enLow.count >= 2 && enLow.avgIntensity !== null && stats.avgIntensity !== null &&
                    enLow.avgIntensity >= stats.avgIntensity + 1) {
                    insights.push({ priority: 1, icon: '⚡',
                        text: 'Les crises tendent à être <strong>plus intenses lorsque l\'énergie est basse</strong> (≤3/10).' });
                }
            }

            /* Règle D/E — Type dominant */
            var totalTyped = stats.meltdownCount + stats.shutdownCount;
            if (totalTyped >= 3) {
                if (stats.meltdownPct >= 65) {
                    insights.push({ priority: 1, icon: '🔴',
                        text: '<strong>' + stats.meltdownPct + '%</strong> des crises sont des meltdowns sur cette période.' });
                } else if (stats.shutdownPct >= 65) {
                    insights.push({ priority: 1, icon: '🔵',
                        text: '<strong>' + stats.shutdownPct + '%</strong> des crises sont des shutdowns sur cette période.' });
                }
            }

            /* Règle C — Contexte dominant */
            if (stats.total >= 3 && stats.topProfile && stats.profileCounts.length > 1) {
                var ctxPct = Math.round((stats.topProfile.count / stats.total) * 100);
                if (ctxPct >= 40) {
                    insights.push({ priority: 2, icon: '📍',
                        text: '<strong>' + ctxPct + '%</strong> des crises surviennent dans le contexte <strong>' +
                            stats.topProfile.name + '</strong>.' });
                }
            }

            /* Règle B — Moment dominant */
            if (stats.total >= 3 && stats.hourSlots) {
                var maxSlot = null;
                for (var hi = 0; hi < stats.hourSlots.length; hi++) {
                    if (!maxSlot || stats.hourSlots[hi].count > maxSlot.count) maxSlot = stats.hourSlots[hi];
                }
                if (maxSlot && maxSlot.count > 0) {
                    var slotPct = Math.round((maxSlot.count / stats.total) * 100);
                    if (slotPct >= 45) {
                        insights.push({ priority: 2, icon: '🕐',
                            text: '<strong>' + slotPct + '%</strong> des crises se produisent <strong>' +
                                (maxSlot.name === 'Matin' ? 'le matin' : maxSlot.name === 'Après-m.' ? 'l\'après-midi' :
                                 maxSlot.name === 'Soir' ? 'le soir' : 'la nuit') + '</strong>.' });
                    }
                }
            }

            /* Règle A — Déclencheur dominant */
            if (stats.triggerStats.length > 0 && stats.total >= 3) {
                var topT = stats.triggerStats[0];
                var tPct = Math.round((topT.count / stats.total) * 100);
                if (tPct >= 30 && topT.count >= 3) {
                    insights.push({ priority: 2, icon: '🎯',
                        text: 'Le déclencheur le plus fréquent est <strong>' + topT.name +
                            '</strong> (' + topT.count + ' fois, ' + tPct + '% des crises).' });
                }
            }

            /* Règle H — Charge mentale haute → crises plus intenses */
            if (stats.thresholds && stats.thresholds.chargeMentale) {
                var cmHigh = stats.thresholds.chargeMentale[2];
                if (cmHigh.count >= 2 && cmHigh.avgIntensity !== null && stats.avgIntensity !== null &&
                    cmHigh.avgIntensity >= stats.avgIntensity + 1) {
                    insights.push({ priority: 2, icon: '🧠',
                        text: 'Les crises sont <strong>plus intenses quand la charge mentale est élevée</strong> (≥7/10).' });
                }
            }

            /* Règle I — Charge sociale haute → crises plus intenses */
            if (stats.thresholds && stats.thresholds.chargeSociale) {
                var csHigh = stats.thresholds.chargeSociale[2];
                if (csHigh.count >= 2 && csHigh.avgIntensity !== null && stats.avgIntensity !== null &&
                    csHigh.avgIntensity >= stats.avgIntensity + 1) {
                    insights.push({ priority: 2, icon: '👥',
                        text: 'Les crises sont <strong>plus intenses quand la charge sociale est élevée</strong> (≥7/10).' });
                }
            }

            /* Règle J — Besoin dominant */
            if (stats.besoinCounts.length > 0 && stats.total >= 3) {
                var topB = stats.besoinCounts[0];
                var bPct = Math.round((topB.count / stats.total) * 100);
                if (bPct >= 40) {
                    insights.push({ priority: 3, icon: '💬',
                        text: 'Besoin le plus exprimé : <strong>' + topB.name +
                            '</strong> (' + bPct + '% des crises).' });
                }
            }

            /* Règle K — Amélioration vs période précédente */
            if (stats.prev && stats.prev.count >= 3 && stats.total >= 3) {
                var pctImprove = Math.round(((stats.total - stats.prev.count) / stats.prev.count) * 100);
                if (pctImprove <= -20) {
                    insights.push({ priority: 1, icon: '✨',
                        text: 'Bonne nouvelle : <strong>' + Math.abs(pctImprove) + '% moins de crises</strong> que la période précédente.' });
                }
            }

            /* Règle L — Cluster détecté (≥3 crises en ≤5 jours) */
            if (stats.total >= 3 && stats.entries.length >= 3) {
                var sortedCluster = stats.entries.slice().sort(function(a, b) {
                    return new Date(a.horodatage) - new Date(b.horodatage);
                });
                var maxCluster = 0;
                for (var cl1 = 0; cl1 < sortedCluster.length; cl1++) {
                    var clWinStart = new Date(sortedCluster[cl1].horodatage);
                    var clWinEnd = new Date(clWinStart.getTime() + 5 * 86400000);
                    var clCount = 0;
                    for (var cl2 = 0; cl2 < sortedCluster.length; cl2++) {
                        var clD = new Date(sortedCluster[cl2].horodatage);
                        if (clD >= clWinStart && clD <= clWinEnd) clCount++;
                    }
                    if (clCount > maxCluster) maxCluster = clCount;
                }
                if (maxCluster >= 3) {
                    insights.push({ priority: 1, icon: '⚠️',
                        text: 'Cluster détecté : jusqu\'à <strong>' + maxCluster + ' crises en 5 jours</strong> — signe d\'une période de surcharge.' });
                }
            }

            /* Règle M — Déclencheur le plus intense (≠ plus fréquent) */
            if (stats.triggerStats.length >= 2) {
                var withIntensity = stats.triggerStats.filter(function(t) { return t.avgIntensity !== null; });
                if (withIntensity.length >= 1) {
                    var mostIntense = withIntensity.slice().sort(function(a, b) {
                        return (b.avgIntensity || 0) - (a.avgIntensity || 0);
                    })[0];
                    var mostFrequent = stats.triggerStats[0];
                    if (mostIntense.name !== mostFrequent.name && mostIntense.avgIntensity >= 6) {
                        insights.push({ priority: 2, icon: '🔥',
                            text: 'Déclencheur le plus intense : <strong>' + mostIntense.name +
                                '</strong> (' + mostIntense.avgIntensity + '/10 en moy.) — différent du plus fréquent.' });
                    }
                }
            }

            /* Règle N — Seuil énergie (fréquence) */
            if (stats.thresholds && stats.thresholds.energie) {
                var enLowN = stats.thresholds.energie[0];
                var enTotalN = enLowN.count + stats.thresholds.energie[1].count + stats.thresholds.energie[2].count;
                if (enTotalN >= 3 && enLowN.count >= 2) {
                    var enPctN = Math.round((enLowN.count / enTotalN) * 100);
                    if (enPctN >= 40) {
                        insights.push({ priority: 2, icon: '⚡',
                            text: '<strong>' + enPctN + '% de tes crises</strong> arrivent quand ton énergie est basse (≤3/10).' });
                    }
                }
            }

            /* Règle O — Seuil charge mentale (fréquence) */
            if (stats.thresholds && stats.thresholds.chargeMentale) {
                var cmHighO = stats.thresholds.chargeMentale[2];
                var cmTotalO = stats.thresholds.chargeMentale[0].count + stats.thresholds.chargeMentale[1].count + cmHighO.count;
                if (cmTotalO >= 3 && cmHighO.count >= 2) {
                    var cmPctO = Math.round((cmHighO.count / cmTotalO) * 100);
                    if (cmPctO >= 40) {
                        insights.push({ priority: 2, icon: '🧠',
                            text: '<strong>' + cmPctO + '% de tes crises</strong> arrivent quand ta charge mentale est élevée (≥7/10).' });
                    }
                }
            }

            /* Règle P — Seuil charge sociale (fréquence) */
            if (stats.thresholds && stats.thresholds.chargeSociale) {
                var csHighP = stats.thresholds.chargeSociale[2];
                var csTotalP = stats.thresholds.chargeSociale[0].count + stats.thresholds.chargeSociale[1].count + csHighP.count;
                if (csTotalP >= 3 && csHighP.count >= 2) {
                    var csPctP = Math.round((csHighP.count / csTotalP) * 100);
                    if (csPctP >= 40) {
                        insights.push({ priority: 2, icon: '👥',
                            text: '<strong>' + csPctP + '% de tes crises</strong> arrivent quand ta charge sociale est élevée (≥7/10).' });
                    }
                }
            }

            /* Règle Q — Capacité systématiquement impossible */
            if (stats.capImpCounts.length > 0 && stats.total >= 3) {
                var crisisesWithCaps = 0;
                for (var qe = 0; qe < stats.entries.length; qe++) {
                    var qCaps = stats.entries[qe].capacites || {};
                    if ((qCaps.impossible || []).length > 0 || (qCaps.difficile || []).length > 0) crisisesWithCaps++;
                }
                if (crisisesWithCaps >= 3) {
                    var topCapQ = stats.capImpCounts[0];
                    var capPctQ = Math.round((topCapQ.count / crisisesWithCaps) * 100);
                    if (capPctQ >= 50) {
                        insights.push({ priority: 2, icon: '⛔',
                            text: 'La capacité <strong>"' + topCapQ.name + '"</strong> est impossible dans <strong>' +
                                capPctQ + '% de tes crises</strong>.' });
                    }
                }
            }

            if (!insights.length) return '';

            insights.sort(function(a, b) { return a.priority - b.priority; });
            var topInsights = insights.slice(0, 8);

            var html = '<div class="insights-list">';
            for (var i = 0; i < topInsights.length; i++) {
                html += '<div class="insight-card">' +
                    '<div class="insight-icon">' + topInsights[i].icon + '</div>' +
                    '<div class="insight-text">' + topInsights[i].text + '</div>' +
                    '</div>';
            }
            html += '</div>';
            return html;
        }

        /* ---------- NAVIGATION VERS ANALYSE ---------- */

        function goToAnalyse() {
            localStorage.setItem('statsNavDays', currentDays);
            localStorage.setItem('statsNavFrom', customFrom || '');
            localStorage.setItem('statsNavTo', customTo || '');
            localStorage.setItem('statsNavFilters', JSON.stringify(activeFilters));
            window.location.href = 'stats-approfondie.html';
        }

        function renderCurrent() {
            try {
                render(currentDays, customFrom, customTo);
            } catch (err) {
                console.error('Stats render error:', err);
                document.getElementById('mainContent').innerHTML =
                    '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement.<br>Réessaie.</div></div>';
            }
        }

        restoreNav();
        initFilterContextes();
        renderCurrent();
        window.addEventListener('pagehide', saveNav);

        document.getElementById('btnBack').addEventListener('click', function() { window.location.href = 'journal.html'; });
        document.getElementById('btnHome').addEventListener('click', function() { location.replace('index.html'); });
        document.getElementById('btnTabAnalyse').addEventListener('click', goToAnalyse);
        document.getElementById('filterBtn').addEventListener('click', toggleFilterPanel);
        document.getElementById('filterOverlay').addEventListener('click', closeFilterPanel);
        document.getElementById('btnResetFilters').addEventListener('click', resetFilters);
        document.getElementById('btnApplyFilters').addEventListener('click', applyFilters);
        document.getElementById('btnShare').addEventListener('click', function() { openShareExportModal('share'); });
        document.getElementById('btnExport').addEventListener('click', function() { openShareExportModal('export'); });
        document.getElementById('exportModalOverlay').addEventListener('click', closeExportModal);
        document.getElementById('btnShareOverview').addEventListener('click', function() { doShareExport('overview'); });
        document.getElementById('btnShareAnalysis').addEventListener('click', function() { doShareExport('analysis'); });
        document.getElementById('btnShareBoth').addEventListener('click', function() { doShareExport('both'); });
        document.getElementById('btnExportCSV').addEventListener('click', exportCSV);
        document.getElementById('btnExportPrint').addEventListener('click', exportPrint);
        document.getElementById('btnCloseExportModal').addEventListener('click', closeExportModal);

        document.querySelector('.period-bar').addEventListener('click', function(e) {
            var btn = e.target.closest('.period-btn[data-days]');
            if (btn) selectPeriod(Number(btn.dataset.days));
        });
        document.getElementById('filterPanel').addEventListener('click', function(e) {
            var chip = e.target.closest('.filter-chip');
            if (chip) toggleFilterChip(chip);
        });
        document.getElementById('mainContent').addEventListener('click', function(e) {
            var accBtn = e.target.closest('.accordion-toggle[data-acc-id]');
            if (accBtn) { toggleAccordion(accBtn.dataset.accId, accBtn); return; }
            var viewBtn = e.target.closest('.view-toggle-btn[data-view-id]');
            if (viewBtn) setView(viewBtn.dataset.viewId, viewBtn.dataset.viewMode);
        });

        (function() {
            var startX, startY;
            document.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });
            document.addEventListener('touchend', function(e) {
                if (startX === undefined) return;
                var dx = e.changedTouches[0].clientX - startX;
                var dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
                    if (dx < 0) { saveNav(); window.location.href = 'stats-approfondie.html'; }
                }
                startX = undefined;
            }, { passive: true });
        })();

        function showToast(msg, duration) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(function() { t.classList.remove('visible'); }, duration || 3000);
        }
    </script>
    <div class="toast" id="toast"></div>
    <script src="nora-scroll.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
