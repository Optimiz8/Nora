<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Nora – Statistiques</title>
    <style>
        body { padding-bottom: 80px; }

        /* ---------- PÉRIODE ---------- */

        .period-bar {
            display: flex;
            gap: 8px;
            padding: 0 16px;
        }

        .period-btn {
            flex: 1;
            background: rgba(245, 228, 204, 0.1);
            border: 2px solid rgba(245, 228, 204, 0.15);
            color: var(--light);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
        }

        .period-btn.active {
            background: var(--light);
            border-color: var(--light);
            color: var(--dark);
        }

        .period-btn:active { transform: scale(0.97); }

        /* ---------- PLAGE PERSONNALISÉE ---------- */

        .date-range-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 12px 16px;
        }

        .date-range-panel.visible { display: flex; }

        .date-range-row { display: flex; gap: 10px; align-items: center; }

        .date-range-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--light);
            width: 44px;
            flex-shrink: 0;
        }

        .date-range-input {
            flex: 1;
            background: rgba(245, 228, 204, 0.12);
            border: 2px solid rgba(245, 228, 204, 0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--light);
            color-scheme: dark;
        }

        .date-range-input:focus { outline: none; border-color: var(--light); }

        .date-range-apply {
            background: var(--accent);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .date-range-apply:active { transform: scale(0.98); }

        /* ---------- CONTENU ---------- */

        .main-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ---------- TITRES DE SECTION ---------- */

        .section-tag {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--accent);
            padding: 18px 2px 6px;
        }

        /* ---------- CARTE BLANCHE ---------- */

        .stat-card {
            background: var(--light);
            border-radius: 14px;
            overflow: hidden;
        }

        /* ---------- LIGNES LABEL / VALEUR ---------- */

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 16px;
            border-bottom: 1px solid rgba(46, 58, 89, 0.08);
            gap: 12px;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-label {
            font-size: 15px;
            color: var(--dark);
            opacity: 0.65;
            font-weight: 500;
            flex-shrink: 0;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            text-align: right;
        }

        .stat-value.large { font-size: 28px; }

        .stat-delta {
            font-size: 14px;
            font-weight: 600;
            margin-left: 6px;
            color: var(--dark);
            opacity: 0.55;
        }

        .stat-sub {
            font-size: 14px;
            font-weight: 400;
            color: var(--dark);
            opacity: 0.5;
            display: block;
            margin-top: 2px;
        }

        /* ---------- DERNIÈRE CRISE ---------- */

        .last-crisis-row {
            background: var(--light);
            border-radius: 14px;
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .last-crisis-label { font-size: 15px; color: var(--dark); opacity: 0.65; }
        .last-crisis-value { font-size: 18px; font-weight: 700; color: var(--dark); }

        /* ---------- GRILLE MOMENTS ---------- */

        .moment-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: rgba(46, 58, 89, 0.08);
            border-radius: 14px;
            overflow: hidden;
        }

        .moment-cell {
            background: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 14px 4px;
        }

        .view-toggle {
            display: flex;
            background: rgba(46, 58, 89, 0.08);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .view-toggle-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            opacity: 0.5;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-toggle-btn.active {
            background: var(--dark);
            color: var(--light);
            opacity: 1;
        }

        /* ---------- VUE RAPIDE (pills) ---------- */

        .pills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding-bottom: 8px;
        }

        .pill {
            background: rgba(46, 58, 89, 0.08);
            color: var(--dark);
            font-size: 14px;
            font-weight: 600;
            padding: 6px 11px;
            border-radius: 20px;
        }

        /* ---------- VUE DÉTAIL (barres) ---------- */

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .rank-number {
            width: 22px;
            height: 22px;
            background: var(--dark);
            color: var(--light);
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .rank-number.secondary {
            background: rgba(46, 58, 89, 0.3);
            font-size: 11px;
        }

        .rank-bar-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .rank-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
            gap: 6px;
        }

        .rank-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .rank-meta {
            font-size: 14px;
            color: var(--dark);
            opacity: 0.5;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .rank-bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(46, 58, 89, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .rank-bar-fill {
            height: 100%;
            background: var(--dark);
            border-radius: 3px;
        }

        .rank-count {
            font-size: 13px;
            color: var(--dark);
            opacity: 0.55;
            white-space: nowrap;
            font-weight: 600;
        }

        .intensity-tag {
            font-size: 11px;
            color: var(--dark);
            opacity: 0.45;
            white-space: nowrap;
        }

        .intensity-legend {
            font-size: 11px;
            color: var(--dark);
            opacity: 0.4;
            font-style: italic;
            padding: 2px 0 6px;
        }

        /* ---------- ACCORDÉON ---------- */

        .accordion-toggle {
            width: 100%;
            background: none;
            border: none;
            border-top: 1px solid rgba(46, 58, 89, 0.1);
            padding: 9px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            opacity: 0.6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .accordion-toggle:active { opacity: 1; }

        .accordion-body { display: none; padding-bottom: 6px; }
        .accordion-body.open { display: block; }

        .all-rank-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 8px;
        }

        /* ---------- JOURS / HEURES ---------- */

        .hour-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .hour-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 4px;
            border-radius: 8px;
            background: rgba(46, 58, 89, 0.06);
        }

        .hour-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            opacity: 0.7;
        }

        .hour-range {
            font-size: 10px;
            color: var(--dark);
            opacity: 0.4;
        }

        .hour-count {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        /* ---------- BILAN COMPARAISON ---------- */

        .bilan-comp-header {
            display: flex;
            align-items: center;
            padding: 8px 16px 6px;
        }

        .bilan-comp-spacer { flex: 1; }

        .bilan-comp-col-hd {
            width: 80px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--dark);
            opacity: 0.45;
        }

        .bilan-comp-col-hd.col-current { opacity: 0.9; }

        .bilan-comp-row {
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-top: 1px solid rgba(46, 58, 89, 0.08);
        }

        .bilan-comp-label {
            flex: 1;
            font-size: 16px;
            color: var(--dark);
            opacity: 0.65;
            font-weight: 500;
            padding: 12px 8px 12px 0;
        }

        .bilan-comp-current {
            width: 80px;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .bilan-comp-prev {
            width: 80px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            opacity: 0.45;
            padding: 10px 0;
            line-height: 1.4;
        }

        .no-prev .bilan-comp-prev,
        .no-prev .bilan-comp-col-hd:last-child { display: none; }

        /* ---------- BILAN ENRICHI ---------- */

        .bilan-unit {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.55;
        }

        .bilan-prev-val {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.55;
        }

        .bilan-minmax {
            padding: 4px 16px 10px;
            font-size: 13px;
            color: var(--dark);
            opacity: 0.55;
        }

        .bilan-minmax strong { font-weight: 700; }

        .bilan-minmax-inline {
            font-size: 11px;
            font-weight: 400;
            color: var(--dark);
            opacity: 0.5;
            line-height: 1.3;
        }

        .bilan-minmax-inline strong { font-weight: 700; }

        /* ---------- GRILLE JOURS ---------- */

        .day-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: rgba(46, 58, 89, 0.08);
            overflow: hidden;
        }

        .day-cell {
            background: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 10px 2px;
        }

        .day-cell.top-day { background: var(--dark); }

        .day-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            opacity: 0.7;
        }

        .day-count {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .day-cell.top-day .day-name,
        .day-cell.top-day .day-count {
            color: var(--light);
            opacity: 1;
        }

        /* ---------- EXPORT ---------- */

        .export-stats-btn {
            background: rgba(245, 228, 204, 0.08);
            border: 2px solid rgba(245, 228, 204, 0.16);
            color: var(--light);
            font-size: 15px;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .export-stats-btn:active {
            background: rgba(245, 228, 204, 0.14);
            transform: scale(0.98);
        }
        .export-stats-btn.icon-btn { width: auto; flex: 1; }

        /* ---------- MODALE EXPORT ---------- */

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .export-modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--dark); border-radius: 20px 20px 0 0;
            padding: 20px 16px 32px; z-index: 201;
            display: flex; flex-direction: column; gap: 10px;
            transform: translateY(100%); transition: transform 0.25s ease;
        }
        .export-modal.visible { transform: translateY(0); }

        .export-modal-title {
            font-size: 16px; font-weight: 700; color: var(--light);
            text-align: center; margin-bottom: 4px;
        }
        .export-option-btn {
            background: rgba(245,228,204,0.1); border: 1px solid rgba(245,228,204,0.15);
            color: var(--light); font-size: 15px; font-weight: 600;
            padding: 14px; border-radius: 12px; cursor: pointer; text-align: left;
        }
        .export-option-btn.primary {
            background: var(--accent); border-color: var(--accent); color: var(--dark);
        }
        .export-option-btn:active { transform: scale(0.98); }
        .export-cancel-btn {
            background: none; border: none; color: rgba(245,228,204,0.5);
            font-size: 15px; font-weight: 600; padding: 10px; cursor: pointer;
            text-align: center;
        }

        /* ---------- ÉTAT VIDE ---------- */

        .empty-state {
            text-align: center;
            padding: 50px 20px 20px;
            color: var(--light);
            opacity: 0.6;
        }

        .empty-icon { font-size: 52px; margin-bottom: 12px; }
        .empty-text { font-size: 16px; }

        .no-data {
            font-size: 14px;
            color: var(--dark);
            opacity: 0.4;
            font-style: italic;
            padding: 2px 0 8px;
        }

        .filter-apply {
            flex: 2;
            background: var(--accent);
            border: none;
            color: var(--dark);
        }

        .last-crisis-value { font-weight: 700; }

        /* ---------- FILTRES AVANCÉS ---------- */

        .filter-bar { padding: 8px 16px; }

        .filter-btn {
            width: 100%;
            background: rgba(245, 228, 204, 0.08);
            border: 1.5px solid rgba(245, 228, 204, 0.22);
            color: var(--light);
            font-size: 14px;
            font-weight: 600;
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn.has-filters { border-color: var(--accent); color: var(--accent); background: rgba(247,184,156,0.08); }

        .filter-badge {
            background: var(--accent);
            color: var(--dark);
            font-size: 11px;
            font-weight: 800;
            border-radius: 10px;
            padding: 1px 6px;
        }

        .filter-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
        }

        .filter-overlay.visible { display: block; }

        .filter-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--light);
            border-radius: 18px 18px 0 0;
            padding: 20px 16px 30px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        .filter-panel.visible { transform: translateY(0); }

        .filter-panel-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
        }

        .filter-group {
            margin-bottom: 16px;
        }

        .filter-group-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-chip {
            background: rgba(46, 58, 89, 0.08);
            border: 2px solid transparent;
            color: var(--dark);
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .filter-chip.selected {
            background: var(--dark);
            color: var(--light);
        }

        .filter-range-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-range-label {
            font-size: 14px;
            color: var(--dark);
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .filter-range-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(46, 58, 89, 0.15);
            outline: none;
        }

        .filter-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: var(--dark);
            border-radius: 50%;
            cursor: pointer;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .filter-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .filter-reset-btn {
            background: rgba(46, 58, 89, 0.08);
            color: var(--dark);
        }

        .filter-apply-btn {
            background: var(--accent);
            color: var(--dark);
        }

        /* ---------- GRAPHIQUES SVG ---------- */

        .chart-container {
            background: var(--light);
            border-radius: 14px;
            padding: 14px;
            overflow: hidden;
        }

        .chart-container svg {
            width: 100%;
            display: block;
        }

        .chart-legend {
            display: flex;
            gap: 14px;
            padding: 8px 0 0;
            flex-wrap: wrap;
        }

        .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--dark);
            opacity: 0.7;
        }

        .chart-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .chart-bar-label {
            font-size: 13px;
            color: var(--dark);
            opacity: 0.6;
            text-align: center;
        }

        /* ---------- ANALYSE APPROFONDIE ---------- */

        .analysis-gate {
            text-align: center;
            padding: 24px 16px;
            color: var(--light);
            opacity: 0.5;
            font-size: 14px;
            font-style: italic;
        }

        .cross-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            color: var(--dark);
        }

        .cross-table th {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.5;
            padding: 8px 6px;
            text-align: center;
            border-bottom: 2px solid rgba(46, 58, 89, 0.12);
        }

        .cross-table th:first-child { text-align: left; }

        .cross-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(46, 58, 89, 0.06);
        }

        .cross-table td:first-child {
            text-align: left;
            font-weight: 600;
        }

        .cross-table .cell-highlight {
            font-weight: 700;
            color: var(--accent);
        }

        /* ---------- CARTE NARRATIVE ---------- */

        .narrative-card {
            background: var(--dark);
            border-radius: 14px;
            padding: 16px 18px;
            font-size: 15px;
            color: var(--light);
            line-height: 1.65;
        }

        .narrative-card strong { font-weight: 700; }

        /* ---------- INSIGHTS ---------- */

        .insight-card {
            background: var(--dark);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .insight-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .insight-text {
            font-size: 14px;
            color: var(--light);
            line-height: 1.5;
        }

        .insights-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ---------- BOUTON ANALYSE ---------- */

        .analyse-link-btn {
            width: 100%;
            background: rgba(245, 228, 204, 0.08);
            border: 2px solid rgba(245, 228, 204, 0.2);
            color: var(--light);
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .analyse-link-btn:active { background: rgba(245, 228, 204, 0.14); transform: scale(0.98); }

        /* ---------- ONGLETS DE PAGE ---------- */

        .page-tabs {
            display: flex;
            padding: 12px 16px 0;
            gap: 0;
            border-bottom: 2px solid rgba(245, 228, 204, 0.1);
            margin-bottom: 4px;
            position: sticky;
            top: var(--header-height);
            background: var(--bg);
            z-index: 50;
        }

        /* ---------- VUE D'ENSEMBLE HEADER (section-tag + filtre avancé) ---------- */

        .vue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 2px;
        }

        .vue-header .section-tag { padding-bottom: 6px; }

        /* ---------- PODIUM DÉCLENCHEURS ---------- */

        .podium-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 4px 0 12px;
        }

        .podium-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .podium-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
            min-height: 2.6em;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .podium-count {
            font-size: 13px;
            color: var(--dark);
            opacity: 0.6;
            font-weight: 600;
        }

        .podium-step {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: var(--light);
            border-radius: 6px 6px 0 0;
        }

        .podium-step.p1 { height: 56px; background: var(--dark); }
        .podium-step.p2 { height: 42px; background: rgba(46, 58, 89, 0.65); }
        .podium-step.p3 { height: 30px; background: rgba(46, 58, 89, 0.4); }

        .page-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--light);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 0 12px;
            cursor: pointer;
            opacity: 0.45;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            letter-spacing: 0.01em;
        }

        .page-tab.active {
            opacity: 1;
            border-bottom-color: var(--accent);
        }

        /* ---------- FOOTER EXPORT ---------- */

        .export-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 16px 24px;
            background: var(--bg);
            border-top: 1px solid rgba(245, 228, 204, 0.1);
            display: flex;
            gap: 10px;
        }


        /* ---------- IMPRESSION ---------- */

        @media print {
            .header, .period-header, .period-bar, .export-footer,
            #filterPanel, #filterOverlay, .filter-bar,
            .scroll-indicator, #exportModal, #exportModalOverlay,
            .date-range-row { display: none !important; }

            body { background: #fff !important; color: #333 !important; padding-bottom: 0 !important; }
            .main-content { padding: 16px !important; }
            .section-tag { color: #555 !important; background: none !important; }
            .stat-card { background: #f7f7f7 !important; break-inside: avoid; box-shadow: none !important; border: 1px solid #ddd; }
            .bilan-comp-label, .stat-label { color: #555 !important; }
            .bilan-comp-current, .bilan-comp-prev, .stat-value { color: #222 !important; }
            .bilan-comp-col-hd { color: #555 !important; }
            .rank-label { color: #333 !important; }
            .rank-bar-bg { background: #ddd !important; }
            .rank-bar-fill { background: #999 !important; }
        }

        /* ---------- CAPACITÉS ---------- */

        .cap-category {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--dark);
            opacity: 0.5;
            padding: 10px 0 4px;
        }

        .cap-sep { border-top: 1px solid rgba(46, 58, 89, 0.1); margin-top: 4px; }
    </style>
</head>
<body>

            <button class="export-option-btn primary" id="btnExportPrint">🖨️ Imprimer / PDF</button>
