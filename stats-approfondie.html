<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Nora – Analyse approfondie</title>
    <style>
        body { padding-bottom: 80px; }

        /* ---------- PÉRIODE ---------- */

        .period-bar { display: flex; gap: 8px; padding: 0 16px; }

        .period-btn {
            flex: 1;
            background: rgba(245, 228, 204, 0.1);
            border: 2px solid rgba(245, 228, 204, 0.15);
            color: var(--light);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
        }

        .period-btn.active { background: var(--light); border-color: var(--light); color: var(--dark); }
        .period-btn:active { transform: scale(0.97); }

        .date-range-panel { display: none; flex-direction: column; gap: 10px; padding: 12px 16px; }
        .date-range-panel.visible { display: flex; }
        .date-range-row { display: flex; gap: 10px; align-items: center; }
        .date-range-label { font-size: 14px; font-weight: 600; color: var(--light); width: 44px; flex-shrink: 0; }

        .date-range-input {
            flex: 1; background: rgba(245, 228, 204, 0.12);
            border: 2px solid rgba(245, 228, 204, 0.2); border-radius: 8px;
            padding: 8px 10px; font-size: 15px; font-family: inherit;
            color: var(--light); color-scheme: dark;
        }
        .date-range-input:focus { outline: none; border-color: var(--light); }

        .date-range-apply {
            background: var(--accent); color: var(--dark); border: none;
            border-radius: 8px; padding: 10px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%;
        }

        /* ---------- CONTENU ---------- */

        .main-content { padding: 16px; display: flex; flex-direction: column; gap: 6px; }

        .section-tag {
            font-size: 15px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--accent); padding: 18px 2px 6px;
        }

        .stat-card { background: var(--light); border-radius: 14px; overflow: hidden; }

        /* ---------- FILTRES ---------- */

        .filter-bar { padding: 6px 16px 10px; }

        .filter-btn {
            background: rgba(245, 228, 204, 0.1); border: 2px solid rgba(245, 228, 204, 0.15);
            color: var(--light); font-size: 14px; font-weight: 600;
            padding: 8px 14px; border-radius: 10px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .filter-btn.has-filters { border-color: var(--accent); color: var(--accent); }

        .filter-badge {
            background: var(--accent); color: var(--dark); font-size: 11px;
            font-weight: 800; border-radius: 10px; padding: 1px 6px;
        }

        .filter-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
        .filter-overlay.visible { display: block; }

        .filter-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--light); border-radius: 18px 18px 0 0;
            padding: 20px 16px 30px; z-index: 201;
            transform: translateY(100%); transition: transform 0.3s ease;
            max-height: 80vh; overflow-y: auto;
        }
        .filter-panel.visible { transform: translateY(0); }

        .filter-panel-title { font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
        .filter-group { margin-bottom: 16px; }
        .filter-group-label { font-size: 13px; font-weight: 700; color: var(--dark); opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .filter-chip {
            background: rgba(46, 58, 89, 0.08); border: 2px solid transparent;
            color: var(--dark); font-size: 14px; font-weight: 500;
            padding: 6px 12px; border-radius: 20px; cursor: pointer;
        }
        .filter-chip.selected { background: var(--dark); color: var(--light); }

        .filter-actions { display: flex; gap: 10px; margin-top: 16px; }
        .filter-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
        .filter-reset-btn { background: rgba(46, 58, 89, 0.08); color: var(--dark); }
        .filter-apply-btn { background: var(--accent); color: var(--dark); }

        /* ---------- CLASSEMENTS ---------- */

        .rank-item { display: flex; align-items: center; gap: 10px; }
        .rank-number { width: 22px; height: 22px; background: var(--dark); color: var(--light); border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .rank-number.secondary { background: rgba(46, 58, 89, 0.3); font-size: 11px; }
        .rank-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .rank-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .rank-name { font-size: 14px; font-weight: 600; color: var(--dark); }
        .rank-meta { font-size: 13px; color: var(--dark); opacity: 0.5; }
        .rank-bar-bg { flex: 1; height: 6px; background: rgba(46, 58, 89, 0.1); border-radius: 3px; overflow: hidden; }
        .rank-bar-fill { height: 100%; background: var(--dark); border-radius: 3px; }
        .rank-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

        /* ---------- CAPACITÉS ---------- */

        .cap-category { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dark); opacity: 0.5; padding: 10px 0 4px; }
        .cap-sep { border-top: 1px solid rgba(46, 58, 89, 0.1); margin-top: 4px; }

        /* ---------- GRAPHIQUES ---------- */

        .chart-container { background: var(--light); border-radius: 14px; padding: 14px; overflow: hidden; }
        .chart-container svg { width: 100%; display: block; }

        /* ---------- INSIGHTS ---------- */

        .insight-card { background: var(--dark); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
        .insight-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .insight-text { font-size: 14px; color: var(--light); line-height: 1.5; }
        .insights-list { display: flex; flex-direction: column; gap: 8px; }

        /* ---------- GATE DONNÉES INSUFFISANTES ---------- */

        .analysis-gate {
            background: var(--light); border-radius: 14px;
            padding: 28px 20px; text-align: center;
            color: var(--dark); opacity: 0.6; font-size: 14px; font-style: italic;
        }

        /* ---------- BOUTON RETOUR STATS ---------- */

        .back-to-stats-btn {
            width: 100%; background: rgba(245, 228, 204, 0.08);
            border: 2px solid rgba(245, 228, 204, 0.2); color: var(--light);
            font-size: 15px; font-weight: 600; padding: 14px; border-radius: 12px;
            cursor: pointer; text-align: center;
        }
        .back-to-stats-btn:active { transform: scale(0.98); }

        /* ---------- EMPTY STATE ---------- */

        .empty-state { text-align: center; padding: 50px 20px 20px; color: var(--light); opacity: 0.6; }
        .empty-icon { font-size: 52px; margin-bottom: 12px; }
        .empty-text { font-size: 16px; }

        .no-data { font-size: 13px; color: var(--dark); opacity: 0.4; font-style: italic; padding: 2px 0 8px; }

        /* ---------- EXPORT ---------- */

        .export-stats-btn {
            background: rgba(245, 228, 204, 0.08); border: 2px solid rgba(245, 228, 204, 0.16);
            color: var(--light); font-size: 15px; font-weight: 600;
            padding: 14px; border-radius: 12px; cursor: pointer;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .export-stats-btn:active { background: rgba(245, 228, 204, 0.14); transform: scale(0.98); }

        /* ---------- FOOTER EXPORT ---------- */

        .export-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 16px 24px;
            background: var(--bg);
            border-top: 1px solid rgba(245, 228, 204, 0.1);
            display: flex;
            gap: 10px;
        }

        /* ---------- ONGLETS DE PAGE ---------- */

        .page-tabs {
            display: flex;
            padding: 12px 16px 0;
            border-bottom: 2px solid rgba(245, 228, 204, 0.1);
            margin-bottom: 4px;
            position: sticky;
            top: var(--header-height);
            background: var(--bg);
            z-index: 50;
        }

        .page-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--light);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 0 12px;
            cursor: pointer;
            opacity: 0.45;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            letter-spacing: 0.01em;
        }

        .page-tab.active {
            opacity: 1;
            border-bottom-color: var(--accent);
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" onclick="window.location.href='stats.html'" aria-label="Retour aux statistiques">⬅️</button>
        <h1 class="page-title">Statistiques</h1>
    </header>

    <div class="page-tabs">
        <button class="page-tab" onclick="window.location.href='stats.html'">Vue d'ensemble</button>
        <button class="page-tab active">Analyse</button>
    </div>

    <div class="period-header" style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);padding:14px 16px 6px">Période</div>
    <div class="period-bar">
        <button class="period-btn active" data-days="7" onclick="selectPeriod(7)">7 j</button>
        <button class="period-btn" data-days="30" onclick="selectPeriod(30)">30 j</button>
        <button class="period-btn" data-days="365" onclick="selectPeriod(365)">1 an</button>
        <button class="period-btn" data-days="0" onclick="selectPeriod(0)">Dates</button>
    </div>
    <div class="date-range-panel" id="dateRangePanel">
        <div class="date-range-row">
            <span class="date-range-label">Début</span>
            <input type="date" class="date-range-input" id="dateFrom">
        </div>
        <div class="date-range-row">
            <span class="date-range-label">Fin</span>
            <input type="date" class="date-range-input" id="dateTo">
        </div>
        <button class="date-range-apply" onclick="applyCustomRange()">Appliquer</button>
    </div>

    <div class="filter-bar">
        <button class="filter-btn" id="filterBtn" onclick="toggleFilterPanel()">
            ⚙️ Filtres <span class="filter-badge" id="filterBadge" style="display:none">0</span>
        </button>
    </div>

    <div class="filter-overlay" id="filterOverlay" onclick="closeFilterPanel()"></div>
    <div class="filter-panel" id="filterPanel">
        <div class="filter-panel-title">Filtres avancés</div>
        <div class="filter-group">
            <div class="filter-group-label">Contexte</div>
            <div class="filter-chips" id="filterContexte"></div>
        </div>
        <div class="filter-group">
            <div class="filter-group-label">Origine</div>
            <div class="filter-chips" id="filterOrigine">
                <button class="filter-chip" data-val="Anticipatoire" onclick="toggleFilterChip(this)">Anticipatoire</button>
                <button class="filter-chip" data-val="Réactionnelle" onclick="toggleFilterChip(this)">Réactionnelle</button>
                <button class="filter-chip" data-val="Mixte" onclick="toggleFilterChip(this)">Mixte</button>
            </div>
        </div>
        <div class="filter-group">
            <div class="filter-group-label">Type de crise</div>
            <div class="filter-chips" id="filterType">
                <button class="filter-chip" data-val="Meltdown" onclick="toggleFilterChip(this)">Meltdown</button>
                <button class="filter-chip" data-val="Shutdown" onclick="toggleFilterChip(this)">Shutdown</button>
                <button class="filter-chip" data-val="Mixte" onclick="toggleFilterChip(this)">Mixte</button>
            </div>
        </div>
        <div class="filter-actions">
            <button class="filter-reset-btn" onclick="resetFilters()">Réinitialiser</button>
            <button class="filter-apply-btn" onclick="applyFilters()">Appliquer</button>
        </div>
    </div>

    <main class="main-content" id="mainContent"></main>

    <script src="nora-data.js"></script>
    <script>
        var currentDays = 7;
        var customFrom = null, customTo = null;
        var activeFilters = { contexte: [], origine: [], type: [], intMin: 1, intMax: 10 };

        /* ---------- INIT DEPUIS STATS.HTML ---------- */

        (function restoreNav() {
            var savedDays = localStorage.getItem('statsNavDays');
            var savedFrom = localStorage.getItem('statsNavFrom');
            var savedTo = localStorage.getItem('statsNavTo');
            var savedFilters = localStorage.getItem('statsNavFilters');

            if (savedDays !== null) {
                currentDays = parseInt(savedDays, 10);
                customFrom = savedFrom || null;
                customTo = savedTo || null;
                try { if (savedFilters) activeFilters = JSON.parse(savedFilters); } catch(e) {}
            }

            var btns = document.querySelectorAll('.period-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-days'), 10) === currentDays);
            }
            if (currentDays === 0) {
                var panel = document.getElementById('dateRangePanel');
                if (panel) panel.classList.add('visible');
                if (savedFrom) document.getElementById('dateFrom').value = savedFrom;
                if (savedTo) document.getElementById('dateTo').value = savedTo;
            }
        })();

        /* ---------- DONNÉES ---------- */

        function getJournal() {
            try { return JSON.parse(localStorage.getItem('journalCrises') || '[]'); } catch(e) { return []; }
        }

        function getProfileName(profileId) {
            var info = getContexteInfo(profileId);
            return { name: (info && info.nom) ? info.nom : (profileId || 'Inconnu'), icon: (info && info.emoji) ? info.emoji : '📍' };
        }

        function pct(part, total) { return total > 0 ? Math.round((part / total) * 100) : 0; }
        function avgArr(arr) { if (!arr.length) return null; var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return parseFloat((s / arr.length).toFixed(1)); }
        function formatMins(m) { m = Math.round(m); if (m < 60) return m + ' min'; var h = Math.floor(m/60), r = m%60; return r > 0 ? h + 'h' + (r < 10 ? '0' : '') + r : h + 'h'; }

        function normDeclencheurs(arr) {
            if (!Array.isArray(arr)) return [];
            return arr.map(function(d) { return typeof d === 'string' ? { nom: d, intensite: null } : d; });
        }
        function normEnergie(e) { if (e.energie) return parseFloat(e.energie); if (e.precrisis && e.precrisis.energie !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.energie/10))); return NaN; }
        function normChargeMentale(e) { if (e.chargeMentale) return parseFloat(e.chargeMentale); if (e.precrisis && e.precrisis.chargeMentale !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.chargeMentale/10))); return NaN; }
        function normChargeSociale(e) { if (e.chargeSociale) return parseFloat(e.chargeSociale); if (e.precrisis && e.precrisis.chargeSociale !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.chargeSociale/10))); return NaN; }

        function countFreq(arr) {
            var freq = {}, result = [];
            for (var i = 0; i < arr.length; i++) { if (arr[i]) freq[arr[i]] = (freq[arr[i]] || 0) + 1; }
            for (var k in freq) result.push({ name: k, count: freq[k] });
            result.sort(function(a, b) { return b.count - a.count; });
            return result;
        }

        function extractLabel(item) { return item && item.label ? item.label : item; }

        function matchesFilters(entry) {
            if (activeFilters.contexte.length && activeFilters.contexte.indexOf(entry.profil || 'commun') === -1) return false;
            if (activeFilters.origine.length && activeFilters.origine.indexOf(entry.typeCrise || '') === -1) return false;
            if (activeFilters.type.length && activeFilters.type.indexOf(entry.typeManifestation || '') === -1) return false;
            var intV = parseFloat(entry.intensite);
            if (!isNaN(intV) && (intV < activeFilters.intMin || intV > activeFilters.intMax)) return false;
            return true;
        }

        function computeStats(days, from, to) {
            var journal = getJournal();
            var entries = [];
            if (days === 0 && from && to) {
                var start = new Date(from); start.setHours(0,0,0,0);
                var end = new Date(to); end.setHours(23,59,59,999);
                for (var i = 0; i < journal.length; i++) {
                    var d = new Date(journal[i].horodatage);
                    if (d >= start && d <= end) entries.push(journal[i]);
                }
            } else {
                var now = new Date();
                var cutoff = new Date(now); cutoff.setDate(now.getDate() - days); cutoff.setHours(0,0,0,0);
                for (var j = 0; j < journal.length; j++) {
                    if (new Date(journal[j].horodatage) >= cutoff) entries.push(journal[j]);
                }
            }
            var hasActive = activeFilters.contexte.length || activeFilters.origine.length || activeFilters.type.length;
            if (hasActive) { entries = entries.filter(matchesFilters); }
            if (!entries.length) return null;

            var intensities = [], energies = [], chargesMentales = [], chargesSociales = [];
            var profileArr = [], triggerFreq = {}, etatArr = [], capImpossible = [], capDifficile = [];
            var meltdownCount = 0, shutdownCount = 0;

            for (var k = 0; k < entries.length; k++) {
                var e = entries[k];
                var iv = parseFloat(e.intensite); if (!isNaN(iv)) intensities.push(iv);
                var en = normEnergie(e); if (!isNaN(en)) energies.push(en);
                var cm = normChargeMentale(e); if (!isNaN(cm)) chargesMentales.push(cm);
                var cs = normChargeSociale(e); if (!isNaN(cs)) chargesSociales.push(cs);
                profileArr.push(e.profil || 'commun');
                if (e.typeManifestation === 'Meltdown') meltdownCount++;
                else if (e.typeManifestation === 'Shutdown') shutdownCount++;
                var decl = normDeclencheurs(e.declencheurs);
                for (var d2 = 0; d2 < decl.length; d2++) { if (decl[d2].nom) triggerFreq[decl[d2].nom] = (triggerFreq[decl[d2].nom] || 0) + 1; }
                var etats = e.etats || [];
                for (var et = 0; et < etats.length; et++) { var el = extractLabel(etats[et]); if (el) etatArr.push(el); }
                var caps = e.capacites || {};
                if (caps.impossible) for (var ci = 0; ci < caps.impossible.length; ci++) capImpossible.push(caps.impossible[ci]);
                if (caps.difficile) for (var cd = 0; cd < caps.difficile.length; cd++) capDifficile.push(caps.difficile[cd]);
            }

            var avgIntensity = avgArr(intensities);
            var profileCounts = countFreq(profileArr);
            var topProfileData = profileCounts.length ? profileCounts[0] : null;
            var topProfile = null;
            if (topProfileData) { var pi = getProfileName(topProfileData.name); topProfile = { name: pi.name, icon: pi.icon, count: topProfileData.count }; }

            var triggerStats = [];
            for (var tkey in triggerFreq) {
                var tInts = [], tMelt = 0, tShut = 0;
                for (var te = 0; te < entries.length; te++) {
                    var decl2 = normDeclencheurs(entries[te].declencheurs);
                    var has = false; for (var dd = 0; dd < decl2.length; dd++) { if (decl2[dd].nom === tkey) { has = true; break; } }
                    if (has) { var tv = parseFloat(entries[te].intensite); if (!isNaN(tv)) tInts.push(tv); if (entries[te].typeManifestation === 'Meltdown') tMelt++; else if (entries[te].typeManifestation === 'Shutdown') tShut++; }
                }
                triggerStats.push({ name: tkey, count: triggerFreq[tkey], avgIntensity: avgArr(tInts), meltdownPct: pct(tMelt, tMelt + tShut) });
            }
            triggerStats.sort(function(a, b) { return b.count - a.count; });

            var etatCounts = countFreq(etatArr);
            var avgIntensityByEtat = {};
            for (var ei = 0; ei < etatCounts.length; ei++) {
                var en2 = etatCounts[ei].name, eInts = [];
                for (var ee = 0; ee < entries.length; ee++) { var eList = entries[ee].etats || []; for (var el2 = 0; el2 < eList.length; el2++) { if (extractLabel(eList[el2]) === en2) { var ev = parseFloat(entries[ee].intensite); if (!isNaN(ev)) eInts.push(ev); break; } } }
                avgIntensityByEtat[en2] = avgArr(eInts);
            }

            var avgIntensityByContexte = {}, percentTypeByContexte = {};
            for (var pc2 = 0; pc2 < profileCounts.length; pc2++) {
                var pn = profileCounts[pc2].name, pInts = [], pMelt = 0, pShut = 0;
                for (var pe = 0; pe < entries.length; pe++) {
                    if ((entries[pe].profil || 'commun') === pn) {
                        var pv = parseFloat(entries[pe].intensite); if (!isNaN(pv)) pInts.push(pv);
                        if (entries[pe].typeManifestation === 'Meltdown') pMelt++; else if (entries[pe].typeManifestation === 'Shutdown') pShut++;
                    }
                }
                var pi2 = getProfileName(pn);
                avgIntensityByContexte[pi2.name] = avgArr(pInts);
                percentTypeByContexte[pi2.name] = { meltdown: pct(pMelt, pMelt + pShut) };
            }

            var normFns = { energie: normEnergie, chargeMentale: normChargeMentale, chargeSociale: normChargeSociale };
            var thresholds = { energie: [{},{},{}], chargeMentale: [{},{},{}], chargeSociale: [{},{},{}] };
            for (var tf = 0; tf < ['energie','chargeMentale','chargeSociale'].length; tf++) {
                var field = ['energie','chargeMentale','chargeSociale'][tf];
                var buckets = [[],[],[]];
                for (var se = 0; se < entries.length; se++) {
                    var sv = normFns[field](entries[se]); var si2 = parseFloat(entries[se].intensite);
                    if (isNaN(sv) || isNaN(si2)) continue;
                    buckets[sv <= 3 ? 0 : sv <= 6 ? 1 : 2].push(si2);
                }
                for (var lb = 0; lb < 3; lb++) thresholds[field][lb] = { label: ['0–3','4–6','7–10'][lb], avgIntensity: avgArr(buckets[lb]), count: buckets[lb].length };
            }

            return {
                total: entries.length, entries: entries,
                avgIntensity: avgIntensity,
                avgEnergie: avgArr(energies), avgChargeMentale: avgArr(chargesMentales), avgChargeSociale: avgArr(chargesSociales),
                meltdownCount: meltdownCount, shutdownCount: shutdownCount,
                meltdownPct: pct(meltdownCount, meltdownCount + shutdownCount),
                shutdownPct: pct(shutdownCount, meltdownCount + shutdownCount),
                topProfile: topProfile, profileCounts: profileCounts,
                triggerStats: triggerStats, etatCounts: etatCounts,
                avgIntensityByEtat: avgIntensityByEtat,
                avgIntensityByContexte: avgIntensityByContexte,
                percentTypeByContexte: percentTypeByContexte,
                capImpCounts: countFreq(capImpossible), capDifCounts: countFreq(capDifficile),
                thresholds: thresholds
            };
        }

        /* ---------- SVG : SEUILS CRITIQUES ---------- */

        function buildThresholdsSVG(thresholds) {
            var fields = [
                { key: 'energie', label: 'Énergie avant crise' },
                { key: 'chargeMentale', label: 'Charge mentale' },
                { key: 'chargeSociale', label: 'Charge sociale' }
            ];
            var html = '', hasAny = false;
            for (var f = 0; f < fields.length; f++) {
                var buckets = thresholds[fields[f].key], anyData = false;
                for (var b = 0; b < 3; b++) { if (buckets[b].count > 0) { anyData = true; break; } }
                if (!anyData) continue;
                hasAny = true;
                var W = 280, H = 100, padL = 5, padB = 22, padT = 10;
                var barW = 60, gap = 30, totalBarW = 3 * barW + 2 * gap;
                var startX = (W - totalBarW) / 2, chartH = H - padT - padB, bars = '';
                var colors = ['#a8d5ba','#f7d98e','#f5a5a5'], labels2 = ['0–3','4–6','7–10'];
                for (var bi = 0; bi < 3; bi++) {
                    var x = startX + bi * (barW + gap), val = buckets[bi].avgIntensity || 0;
                    var barH = (val / 10) * chartH, y = padT + chartH - barH;
                    bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" rx="4" fill="' + colors[bi] + '"/>';
                    if (val > 0) bars += '<text x="' + (x + barW/2) + '" y="' + (y - 4) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#2E3A59">' + val + '</text>';
                    bars += '<text x="' + (x + barW/2) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="10" fill="#2E3A59" opacity="0.5">' + labels2[bi] + '</text>';
                    bars += '<text x="' + (x + barW/2) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="9" fill="#2E3A59" opacity="0.35">(' + buckets[bi].count + ')</text>';
                }
                html += '<div style="margin-bottom:8px">' +
                    '<div style="font-size:13px;font-weight:600;color:var(--dark);opacity:0.7;margin-bottom:4px">' + fields[f].label + '</div>' +
                    '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
                    '<line x1="' + padL + '" y1="' + (padT + chartH) + '" x2="' + (W - padL) + '" y2="' + (padT + chartH) + '" stroke="#2E3A59" stroke-opacity="0.1"/>' +
                    bars + '</svg></div>';
            }
            if (!hasAny) return '';
            return '<div class="chart-container">' + html + '</div>';
        }

        /* ---------- INSIGHTS CLINIQUES ---------- */

        function buildDeepInsights(stats) {
            if (stats.total < 5) return '';
            var insights = [];

            /* Contexte à forte intensité */
            if (stats.profileCounts.length > 1 && stats.avgIntensity !== null) {
                for (var pc = 0; pc < stats.profileCounts.length; pc++) {
                    var pn = getProfileName(stats.profileCounts[pc].name);
                    var pAvg = stats.avgIntensityByContexte[pn.name];
                    if (pAvg !== null && pAvg !== undefined && pAvg >= stats.avgIntensity + 1 && stats.profileCounts[pc].count >= 2) {
                        insights.push({ priority: 1, icon: '📍',
                            text: 'Les crises sont <strong>plus intenses dans le contexte ' + pn.icon + ' ' + pn.name + '</strong> (' + pAvg + '/10 vs ' + stats.avgIntensity + '/10 en moyenne).' });
                        break;
                    }
                }
            }

            /* Contexte → type meltdown */
            if (stats.profileCounts.length > 1 && (stats.meltdownCount > 0 || stats.shutdownCount > 0)) {
                for (var pc2 = 0; pc2 < stats.profileCounts.length; pc2++) {
                    var pn2 = getProfileName(stats.profileCounts[pc2].name);
                    var pt = stats.percentTypeByContexte[pn2.name];
                    if (pt && pt.meltdown >= 70 && stats.profileCounts[pc2].count >= 3) {
                        insights.push({ priority: 1, icon: '🔴',
                            text: 'Dans le contexte <strong>' + pn2.icon + ' ' + pn2.name + '</strong>, les crises sont majoritairement des meltdowns (' + pt.meltdown + '%).' });
                        break;
                    }
                }
            }

            /* Charge sociale élevée → crises plus intenses */
            if (stats.thresholds && stats.thresholds.chargeSociale && stats.avgIntensity !== null) {
                var csHigh = stats.thresholds.chargeSociale[2];
                if (csHigh.count >= 2 && csHigh.avgIntensity !== null && csHigh.avgIntensity >= stats.avgIntensity + 1) {
                    insights.push({ priority: 1, icon: '👥',
                        text: 'Une <strong>charge sociale élevée (≥7/10)</strong> est associée à des crises plus intenses (' + csHigh.avgIntensity + '/10).' });
                }
            }

            /* Charge mentale élevée → crises plus intenses */
            if (stats.thresholds && stats.thresholds.chargeMentale && stats.avgIntensity !== null) {
                var cmHigh = stats.thresholds.chargeMentale[2];
                if (cmHigh.count >= 2 && cmHigh.avgIntensity !== null && cmHigh.avgIntensity >= stats.avgIntensity + 1) {
                    insights.push({ priority: 1, icon: '🧠',
                        text: 'Une <strong>charge mentale élevée (≥7/10)</strong> est associée à des crises plus intenses (' + cmHigh.avgIntensity + '/10).' });
                }
            }

            /* Déclencheur → meltdown dominant */
            if (stats.triggerStats.length > 0 && (stats.meltdownCount > 0 || stats.shutdownCount > 0)) {
                var topT = stats.triggerStats[0];
                if (topT.meltdownPct >= 70 && topT.count >= 3) {
                    insights.push({ priority: 2, icon: '🎯',
                        text: 'Le déclencheur <strong>' + topT.name + '</strong> est principalement associé à des meltdowns (' + topT.meltdownPct + '%).' });
                }
            }

            /* État à haute intensité */
            if (stats.etatCounts.length > 0 && stats.avgIntensity !== null) {
                for (var ei = 0; ei < Math.min(stats.etatCounts.length, 5); ei++) {
                    var eAvg = stats.avgIntensityByEtat[stats.etatCounts[ei].name];
                    if (eAvg !== null && eAvg >= 7 && stats.etatCounts[ei].count >= 2) {
                        insights.push({ priority: 2, icon: '😰',
                            text: 'L\'état <strong>' + stats.etatCounts[ei].name + '</strong> est souvent associé à des crises intenses (' + eAvg + '/10).' });
                        break;
                    }
                }
            }

            /* Intensité anormalement élevée */
            if (stats.avgIntensity !== null && stats.avgIntensity >= 7) {
                insights.push({ priority: 2, icon: '⚠️',
                    text: 'L\'intensité moyenne des crises sur cette période est <strong>élevée</strong> (' + stats.avgIntensity + '/10).' });
            }

            if (!insights.length) return '';
            insights.sort(function(a, b) { return a.priority - b.priority; });
            var topInsights = insights.slice(0, 7);
            var html = '<div class="insights-list">';
            for (var i = 0; i < topInsights.length; i++) {
                html += '<div class="insight-card"><div class="insight-icon">' + topInsights[i].icon + '</div>' +
                    '<div class="insight-text">' + topInsights[i].text + '</div></div>';
            }
            return html + '</div>';
        }

        /* ---------- RENDU RANK ROW ---------- */

        function rankRow(item, num, maxCount) {
            var barPct = Math.round((item.count / maxCount) * 100);
            var numEl = num > 0 ? '<div class="rank-number">' + num + '</div>' : '<div class="rank-number secondary">·</div>';
            var meta = item.count + '×';
            if (item.avgIntensity != null) meta += ' · ' + item.avgIntensity + '/10';
            if (item.meltdownPct != null && item.meltdownPct > 0) meta += ' · ' + item.meltdownPct + '% melt.';
            return '<div class="rank-item">' + numEl +
                '<div class="rank-bar-wrap">' +
                '<div class="rank-header"><div class="rank-name">' + item.name + '</div>' +
                '<div class="rank-meta">' + meta + '</div></div>' +
                '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + barPct + '%"></div></div>' +
                '</div></div>';
        }

        /* ---------- RENDU PRINCIPAL ---------- */

        function render(days, from, to) {
            var stats = computeStats(days, from, to);
            var main = document.getElementById('mainContent');

            if (!stats) {
                main.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div>' +
                    '<div class="empty-text">Aucune crise enregistrée<br>sur cette période.</div></div>';
                document.getElementById('exportFooter').style.display = 'none';
                return;
            }

            if (stats.total < 5) {
                main.innerHTML = '<div class="analysis-gate">Données insuffisantes pour l\'analyse approfondie.<br>Il faut au moins 5 crises sur la période sélectionnée.<br><br><em>Actuel : ' + stats.total + ' crise' + (stats.total > 1 ? 's' : '') + '</em></div>';
                document.getElementById('exportFooter').style.display = 'none';
                return;
            }

            var html = '';

            /* ========== CONTEXTES ========== */
            if (stats.profileCounts.length > 1) {
                html += '<div class="section-tag">Contextes</div>';
                html += '<div class="stat-card" style="padding:12px">';
                var maxCtx = stats.profileCounts[0].count;
                for (var pc = 0; pc < stats.profileCounts.length; pc++) {
                    var prof = stats.profileCounts[pc];
                    var pInfo = getProfileName(prof.name);
                    var pAvgInt = stats.avgIntensityByContexte[pInfo.name];
                    var pType = stats.percentTypeByContexte[pInfo.name];
                    html += rankRow({
                        name: pInfo.icon + ' ' + pInfo.name,
                        count: prof.count,
                        avgIntensity: (pAvgInt !== null && pAvgInt !== undefined) ? pAvgInt : null,
                        meltdownPct: (pType && pType.meltdown > 0) ? pType.meltdown : null
                    }, pc + 1, maxCtx);
                }
                html += '</div>';
            }

            /* ========== SEUILS CRITIQUES ========== */
            var thresholdsHtml = buildThresholdsSVG(stats.thresholds);
            if (thresholdsHtml) {
                html += '<div class="section-tag">Seuils critiques</div>';
                html += '<div style="font-size:12px;color:var(--light);opacity:0.5;padding:0 2px 6px">Intensité moyenne de crise selon le niveau avant la crise</div>';
                html += thresholdsHtml;
            }

            /* ========== DÉCLENCHEURS ENRICHIS ========== */
            if (stats.triggerStats.length) {
                html += '<div class="section-tag">Déclencheurs</div>';
                html += '<div class="stat-card" style="padding:12px">';
                var maxTrig = stats.triggerStats[0].count;
                for (var ti = 0; ti < Math.min(stats.triggerStats.length, 8); ti++) {
                    html += rankRow(stats.triggerStats[ti], ti + 1, maxTrig);
                }
                html += '</div>';
            }

            /* ========== ÉTATS × INTENSITÉ ========== */
            if (stats.etatCounts.length) {
                html += '<div class="section-tag">États ressentis</div>';
                html += '<div class="stat-card" style="padding:12px">';
                var maxEtat = stats.etatCounts[0].count;
                for (var ei = 0; ei < Math.min(stats.etatCounts.length, 7); ei++) {
                    var et = stats.etatCounts[ei];
                    var eAvgI = stats.avgIntensityByEtat[et.name];
                    html += rankRow({ name: et.name, count: et.count, avgIntensity: eAvgI, meltdownPct: null }, ei + 1, maxEtat);
                }
                html += '</div>';
            }

            /* ========== CAPACITÉS ========== */
            if (stats.capImpCounts.length || stats.capDifCounts.length) {
                html += '<div class="section-tag">Capacités impactées</div>';
                html += '<div class="stat-card" style="padding:12px">';
                if (stats.capImpCounts.length) {
                    html += '<div class="cap-category">Impossible</div>';
                    var maxImp = stats.capImpCounts[0].count;
                    for (var ci = 0; ci < Math.min(stats.capImpCounts.length, 7); ci++) {
                        html += rankRow({ name: stats.capImpCounts[ci].name, count: stats.capImpCounts[ci].count, avgIntensity: null, meltdownPct: null }, ci + 1, maxImp);
                    }
                }
                if (stats.capDifCounts.length) {
                    html += '<div class="cap-category cap-sep">Souvent difficile</div>';
                    var maxDif = stats.capDifCounts[0].count;
                    for (var cdi = 0; cdi < Math.min(stats.capDifCounts.length, 7); cdi++) {
                        html += rankRow({ name: stats.capDifCounts[cdi].name, count: stats.capDifCounts[cdi].count, avgIntensity: null, meltdownPct: null }, cdi + 1, maxDif);
                    }
                }
                html += '</div>';
            }

            /* ========== INSIGHTS CLINIQUES ========== */
            var deepHtml = buildDeepInsights(stats);
            if (deepHtml) {
                html += '<div class="section-tag">Observations</div>';
                html += deepHtml;
            }

            main.innerHTML = html;
            document.getElementById('exportFooter').style.display = 'flex';
        }

        /* ---------- EXPORT ---------- */

        function getPeriodLabel() {
            return currentDays === 7 ? '7 derniers jours' : currentDays === 30 ? '30 derniers jours' :
                currentDays === 365 ? 'dernière année' : 'du ' + customFrom + ' au ' + customTo;
        }

        function shareStats() {
            var stats = computeStats(currentDays, customFrom, customTo);
            if (!stats) { alert('Aucune donnée à partager.'); return; }
            var text = '== Analyse Nora — ' + getPeriodLabel() + ' ==\n\n';
            text += 'Crises : ' + stats.total + '\n';
            if (stats.avgIntensity !== null) text += 'Intensité moyenne : ' + stats.avgIntensity + '/10\n';
            if (stats.avgDuration !== null) text += 'Durée moyenne : ' + formatMins(stats.avgDuration) + '\n';
            if (stats.triggerStats.length) {
                text += '\nDéclencheurs :\n';
                for (var i = 0; i < Math.min(stats.triggerStats.length, 5); i++) {
                    text += '  ' + (i + 1) + '. ' + stats.triggerStats[i].name + ' (' + stats.triggerStats[i].count + '×)\n';
                }
            }
            text += '\nExport du ' + new Date().toLocaleDateString('fr-FR') + ' — Nora.';
            if (navigator.share) {
                navigator.share({ title: 'Analyse Nora', text: text }).catch(function() {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { alert('Résumé copié !'); }).catch(function() { downloadText(text); });
            } else {
                downloadText(text);
            }
        }

        function downloadText(text) {
            var blob = new Blob([text], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url;
            a.download = 'analyse-nora-' + new Date().toISOString().split('T')[0] + '.txt';
            a.click(); URL.revokeObjectURL(url);
        }

        /* ---------- FILTRES ---------- */

        function initFilterContextes() {
            var journal = getJournal(), profils = {};
            for (var i = 0; i < journal.length; i++) profils[journal[i].profil || 'commun'] = true;
            var container = document.getElementById('filterContexte');
            container.innerHTML = '';
            for (var key in profils) {
                var info = getProfileName(key);
                var btn = document.createElement('button');
                btn.className = 'filter-chip';
                btn.setAttribute('data-val', key);
                btn.textContent = info.icon + ' ' + info.name;
                if (activeFilters.contexte.indexOf(key) !== -1) btn.classList.add('selected');
                btn.onclick = function() { toggleFilterChip(this); };
                container.appendChild(btn);
            }
            var fixed = document.querySelectorAll('#filterOrigine .filter-chip, #filterType .filter-chip');
            for (var j = 0; j < fixed.length; j++) {
                var g = fixed[j].getAttribute('data-val');
                var group = fixed[j].parentElement.id === 'filterOrigine' ? activeFilters.origine : activeFilters.type;
                if (group.indexOf(g) !== -1) fixed[j].classList.add('selected');
            }
        }

        function toggleFilterChip(el) { el.classList.toggle('selected'); }

        function toggleFilterPanel() {
            document.getElementById('filterOverlay').classList.add('visible');
            setTimeout(function() { document.getElementById('filterPanel').classList.add('visible'); }, 10);
        }

        function closeFilterPanel() {
            document.getElementById('filterPanel').classList.remove('visible');
            document.getElementById('filterOverlay').classList.remove('visible');
        }

        function getSelectedChips(containerId) {
            var chips = document.querySelectorAll('#' + containerId + ' .filter-chip.selected'), vals = [];
            for (var i = 0; i < chips.length; i++) vals.push(chips[i].getAttribute('data-val'));
            return vals;
        }

        function applyFilters() {
            activeFilters.contexte = getSelectedChips('filterContexte');
            activeFilters.origine = getSelectedChips('filterOrigine');
            activeFilters.type = getSelectedChips('filterType');
            updateFilterBadge();
            closeFilterPanel();
            renderCurrent();
        }

        function resetFilters() {
            var chips = document.querySelectorAll('.filter-chip.selected');
            for (var i = 0; i < chips.length; i++) chips[i].classList.remove('selected');
            activeFilters = { contexte: [], origine: [], type: [], intMin: 1, intMax: 10 };
            updateFilterBadge(); closeFilterPanel(); renderCurrent();
        }

        function updateFilterBadge() {
            var count = activeFilters.contexte.length + activeFilters.origine.length + activeFilters.type.length;
            var badge = document.getElementById('filterBadge'), btn = document.getElementById('filterBtn');
            if (count > 0) { badge.textContent = count; badge.style.display = 'inline'; btn.classList.add('has-filters'); }
            else { badge.style.display = 'none'; btn.classList.remove('has-filters'); }
        }

        /* ---------- PÉRIODE ---------- */

        function saveNav() {
            localStorage.setItem('statsNavDays', currentDays);
            localStorage.setItem('statsNavFrom', customFrom || '');
            localStorage.setItem('statsNavTo', customTo || '');
            localStorage.setItem('statsNavFilters', JSON.stringify(activeFilters));
        }

        function selectPeriod(days) {
            currentDays = days;
            var btns = document.querySelectorAll('.period-btn');
            for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-days'), 10) === days);
            var panel = document.getElementById('dateRangePanel');
            if (days === 0) panel.classList.add('visible');
            else { panel.classList.remove('visible'); saveNav(); renderCurrent(); }
        }

        function applyCustomRange() {
            var from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            if (!from || !to) { alert('Choisis une date de début et une date de fin.'); return; }
            if (from > to) { alert('La date de début doit être avant la date de fin.'); return; }
            customFrom = from; customTo = to; saveNav(); renderCurrent();
        }

        function renderCurrent() {
            try { render(currentDays, customFrom, customTo); }
            catch (err) {
                console.error('Analyse render error:', err);
                document.getElementById('mainContent').innerHTML =
                    '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement.<br>Réessaie.</div></div>';
            }
        }

        initFilterContextes();
        renderCurrent();
    </script>
    <div class="export-footer" id="exportFooter" style="display:none">
        <button class="export-stats-btn" style="flex:1" onclick="shareStats()">↑ Partager</button>
    </div>

    <script src="nora-scroll.js"></script>
</body>
</html>
