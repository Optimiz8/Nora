<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Nora – Analyse approfondie</title>
    <style>
        body { padding-bottom: 80px; }

        /* ---------- PÉRIODE ---------- */

        .period-bar { display: flex; gap: 8px; padding: 0 16px; }

        .period-btn {
            flex: 1;
            background: rgba(245, 228, 204, 0.1);
            border: 2px solid rgba(245, 228, 204, 0.15);
            color: var(--light);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
        }

        .period-btn.active { background: var(--light); border-color: var(--light); color: var(--dark); }
        .period-btn:active { transform: scale(0.97); }

        .date-range-panel { display: none; flex-direction: column; gap: 10px; padding: 12px 16px; }
        .date-range-panel.visible { display: flex; }
        .date-range-row { display: flex; gap: 10px; align-items: center; }
        .date-range-label { font-size: 14px; font-weight: 600; color: var(--light); width: 44px; flex-shrink: 0; }

        .date-range-input {
            flex: 1; background: rgba(245, 228, 204, 0.12);
            border: 2px solid rgba(245, 228, 204, 0.2); border-radius: 8px;
            padding: 8px 10px; font-size: 15px; font-family: inherit;
            color: var(--light); color-scheme: dark;
        }
        .date-range-input:focus { outline: none; border-color: var(--light); }

        .date-range-apply {
            background: var(--accent); color: var(--dark); border: none;
            border-radius: 8px; padding: 10px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%;
        }

        /* ---------- CONTENU ---------- */

        .main-content { padding: 16px; display: flex; flex-direction: column; gap: 6px; }

        .section-tag {
            font-size: 15px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--accent); padding: 18px 2px 6px;
        }

        .stat-card { background: var(--light); border-radius: 14px; overflow: hidden; }

        /* ---------- FILTRES ---------- */

        .filter-bar { padding: 8px 16px; }

        .filter-btn {
            width: 100%; background: rgba(245, 228, 204, 0.08);
            border: 1.5px solid rgba(245, 228, 204, 0.22);
            color: var(--light); font-size: 14px; font-weight: 600;
            padding: 11px 16px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .filter-btn.has-filters { border-color: var(--accent); color: var(--accent); background: rgba(247,184,156,0.08); }

        .filter-badge {
            background: var(--accent); color: var(--dark); font-size: 11px;
            font-weight: 800; border-radius: 10px; padding: 1px 6px;
        }

        .filter-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
        .filter-overlay.visible { display: block; }

        .filter-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--light); border-radius: 18px 18px 0 0;
            padding: 20px 16px 30px; z-index: 201;
            transform: translateY(100%); transition: transform 0.3s ease;
            max-height: 80vh; overflow-y: auto;
        }
        .filter-panel.visible { transform: translateY(0); }

        .filter-panel-title { font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
        .filter-group { margin-bottom: 16px; }
        .filter-group-label { font-size: 13px; font-weight: 700; color: var(--dark); opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .filter-chip {
            background: rgba(46, 58, 89, 0.08); border: 2px solid transparent;
            color: var(--dark); font-size: 14px; font-weight: 500;
            padding: 6px 12px; border-radius: 20px; cursor: pointer;
        }
        .filter-chip.selected { background: var(--dark); color: var(--light); }

        .filter-actions { display: flex; gap: 10px; margin-top: 16px; }
        .filter-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
        .filter-reset-btn { background: rgba(46, 58, 89, 0.08); color: var(--dark); }
        .filter-apply-btn { background: var(--accent); color: var(--dark); }

        /* ---------- CLASSEMENTS ---------- */

        .rank-item { display: flex; align-items: center; gap: 10px; }
        .rank-number { width: 22px; height: 22px; background: var(--dark); color: var(--light); border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .rank-number.secondary { background: rgba(46, 58, 89, 0.3); font-size: 11px; }
        .rank-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .rank-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .rank-name { font-size: 14px; font-weight: 600; color: var(--dark); }
        .rank-meta { font-size: 13px; color: var(--dark); opacity: 0.5; }
        .rank-bar-bg { flex: 1; height: 6px; background: rgba(46, 58, 89, 0.1); border-radius: 3px; overflow: hidden; }
        .rank-bar-fill { height: 100%; background: var(--dark); border-radius: 3px; }
        .rank-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

        /* ---------- CAPACITÉS ---------- */

        .cap-category { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dark); opacity: 0.5; padding: 10px 0 4px; }
        .cap-sep { border-top: 1px solid rgba(46, 58, 89, 0.1); margin-top: 4px; }

        /* ---------- GRAPHIQUES ---------- */

        .chart-container { background: var(--light); border-radius: 14px; padding: 14px; overflow: hidden; }
        .chart-container svg { width: 100%; display: block; }

        /* ---------- INSIGHTS ---------- */

        .insight-card { background: var(--dark); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
        .insight-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .insight-text { font-size: 14px; color: var(--light); line-height: 1.5; }
        .insights-list { display: flex; flex-direction: column; gap: 8px; }

        /* ---------- GATE DONNÉES INSUFFISANTES ---------- */

        .analysis-gate {
            background: var(--light); border-radius: 14px;
            padding: 28px 20px; text-align: center;
            color: var(--dark); opacity: 0.6; font-size: 14px; font-style: italic;
        }

        /* ---------- BOUTON RETOUR STATS ---------- */

        .back-to-stats-btn {
            width: 100%; background: rgba(245, 228, 204, 0.08);
            border: 2px solid rgba(245, 228, 204, 0.2); color: var(--light);
            font-size: 15px; font-weight: 600; padding: 14px; border-radius: 12px;
            cursor: pointer; text-align: center;
        }
        .back-to-stats-btn:active { transform: scale(0.98); }

        /* ---------- EMPTY STATE ---------- */

        .empty-state { text-align: center; padding: 50px 20px 20px; color: var(--light); opacity: 0.6; }
        .empty-icon { font-size: 52px; margin-bottom: 12px; }
        .empty-text { font-size: 16px; }

        .no-data { font-size: 13px; color: var(--dark); opacity: 0.4; font-style: italic; padding: 2px 0 8px; }

        /* ---------- EXPORT ---------- */

        .export-stats-btn {
            background: rgba(245, 228, 204, 0.08); border: 2px solid rgba(245, 228, 204, 0.16);
            color: var(--light); font-size: 15px; font-weight: 600;
            padding: 14px; border-radius: 12px; cursor: pointer;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .export-stats-btn:active { background: rgba(245, 228, 204, 0.14); transform: scale(0.98); }
        .export-stats-btn.icon-btn { width: auto; flex: 1; }

        /* ---------- MODALE EXPORT ---------- */

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .export-modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--dark); border-radius: 20px 20px 0 0;
            padding: 20px 16px 32px; z-index: 201;
            display: flex; flex-direction: column; gap: 10px;
            transform: translateY(100%); transition: transform 0.25s ease;
        }
        .export-modal.visible { transform: translateY(0); }

        .export-modal-title {
            font-size: 16px; font-weight: 700; color: var(--light);
            text-align: center; margin-bottom: 4px;
        }
        .export-option-btn {
            background: rgba(245,228,204,0.1); border: 1px solid rgba(245,228,204,0.15);
            color: var(--light); font-size: 15px; font-weight: 600;
            padding: 14px; border-radius: 12px; cursor: pointer; text-align: left;
        }
        .export-option-btn.primary {
            background: var(--accent); border-color: var(--accent); color: var(--dark);
        }
        .export-option-btn:active { transform: scale(0.98); }
        .export-cancel-btn {
            background: none; border: none; color: rgba(245,228,204,0.5);
            font-size: 15px; font-weight: 600; padding: 10px; cursor: pointer;
            text-align: center;
        }

        /* ---------- FOOTER EXPORT ---------- */

        .export-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 16px 24px;
            background: var(--bg);
            border-top: 1px solid rgba(245, 228, 204, 0.1);
            display: flex;
            gap: 10px;
        }

        /* ---------- ONGLETS DE PAGE ---------- */

        .page-tabs {
            display: flex;
            padding: 12px 16px 0;
            border-bottom: 2px solid rgba(245, 228, 204, 0.1);
            margin-bottom: 4px;
            position: sticky;
            top: var(--header-height);
            background: var(--bg);
            z-index: 50;
        }

        .page-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--light);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 0 12px;
            cursor: pointer;
            opacity: 0.45;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            letter-spacing: 0.01em;
        }

        .page-tab.active {
            opacity: 1;
            border-bottom-color: var(--accent);
        }

        /* ---------- GRAPHIQUES SVG ---------- */

        .chart-container { background: var(--light); border-radius: 14px; padding: 14px; overflow: hidden; }
        .chart-container svg { width: 100%; display: block; }

        /* ---------- GRILLE JOURS ---------- */

        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: rgba(46, 58, 89, 0.08); overflow: hidden; }
        .day-cell { background: var(--light); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 2px; }
        .day-cell.top-day { background: var(--dark); }
        .day-name { font-size: 12px; font-weight: 600; color: var(--dark); opacity: 0.7; }
        .day-count { font-size: 20px; font-weight: 700; color: var(--dark); }
        .day-cell.top-day .day-name, .day-cell.top-day .day-count { color: var(--light); opacity: 1; }

        /* ---------- GRILLE MOMENTS ---------- */

        .hour-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .hour-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 8px; background: rgba(46, 58, 89, 0.06); }
        .hour-name { font-size: 12px; font-weight: 600; color: var(--dark); opacity: 0.7; }
        .hour-range { font-size: 10px; color: var(--dark); opacity: 0.4; }
        .hour-count { font-size: 20px; font-weight: 700; color: var(--dark); }

        /* ---------- PROFIL DE CRISE ---------- */

        .profile-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--dark); z-index: 201;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.25s ease;
            overflow: hidden;
        }
        .profile-modal.visible { transform: translateY(0); }
        .profile-modal-header {
            display: flex; justify-content: center; align-items: center;
            height: 56px; flex-shrink: 0; padding: 0 20px;
            border-bottom: 1px solid rgba(245,228,204,0.1); position: relative;
        }
        .profile-modal-title { font-size: 20px; font-weight: 700; color: var(--light); text-align: center; flex: 1; }
        .profile-modal-close { position: absolute; right: 16px; background: none; border: none; color: var(--light); font-size: 24px; cursor: pointer; opacity: 0.4; line-height: 1; padding: 2px 4px; }
        #profileContent { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .profile-modal-footer { flex-shrink: 0; padding: 12px 16px; border-top: 1px solid rgba(245,228,204,0.1); display: flex; flex-direction: column; gap: 10px; }
        .profile-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); padding-top: 6px; }
        .profile-card { background: rgba(245,228,204,0.07); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
        .profile-line { font-size: 14px; color: var(--light); line-height: 1.55; }
        .profile-share-btn { background: var(--accent); color: var(--dark); border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }
        .profile-share-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" onclick="window.location.href='stats.html'" aria-label="Retour aux statistiques">⬅️</button>
        <h1 class="page-title">Statistiques</h1>
        <button class="header-icon" onclick="location.replace('index.html')" style="margin-left:auto" aria-label="Accueil">🏠</button>
    </header>

    <div class="page-tabs">
        <button class="page-tab" onclick="window.location.href='stats.html'">Vue d'ensemble</button>
        <button class="page-tab active">Analyse</button>
    </div>

    <div class="filter-bar">
        <button class="filter-btn" id="filterBtn" onclick="toggleFilterPanel()">
            ⚙️ Filtres avancés <span class="filter-badge" id="filterBadge" style="display:none">0</span>
        </button>
    </div>

    <div class="period-header" style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);padding:14px 16px 6px">Période</div>
    <div class="period-bar">
        <button class="period-btn active" data-days="7" onclick="selectPeriod(7)">7 j</button>
        <button class="period-btn" data-days="30" onclick="selectPeriod(30)">30 j</button>
        <button class="period-btn" data-days="365" onclick="selectPeriod(365)">1 an</button>
        <button class="period-btn" data-days="0" onclick="selectPeriod(0)">Dates</button>
    </div>
    <div class="date-range-panel" id="dateRangePanel">
        <div class="date-range-row">
            <span class="date-range-label">Début</span>
            <input type="date" class="date-range-input" id="dateFrom">
        </div>
        <div class="date-range-row">
            <span class="date-range-label">Fin</span>
            <input type="date" class="date-range-input" id="dateTo">
        </div>
        <button class="date-range-apply" onclick="applyCustomRange()">Appliquer</button>
    </div>

    <div class="filter-overlay" id="filterOverlay" onclick="closeFilterPanel()"></div>
    <div class="filter-panel" id="filterPanel">
        <div class="filter-panel-title">Filtres avancés</div>
        <div class="filter-group">
            <div class="filter-group-label">Contexte</div>
            <div class="filter-chips" id="filterContexte"></div>
        </div>
        <div class="filter-group">
            <div class="filter-group-label">Origine</div>
            <div class="filter-chips" id="filterOrigine">
                <button class="filter-chip" data-val="Anticipatoire" onclick="toggleFilterChip(this)">Anticipatoire</button>
                <button class="filter-chip" data-val="Réactionnelle" onclick="toggleFilterChip(this)">Réactionnelle</button>
                <button class="filter-chip" data-val="Mixte" onclick="toggleFilterChip(this)">Mixte</button>
            </div>
        </div>
        <div class="filter-group">
            <div class="filter-group-label">Type de crise</div>
            <div class="filter-chips" id="filterType">
                <button class="filter-chip" data-val="Meltdown" onclick="toggleFilterChip(this)">Meltdown</button>
                <button class="filter-chip" data-val="Shutdown" onclick="toggleFilterChip(this)">Shutdown</button>
                <button class="filter-chip" data-val="Mixte" onclick="toggleFilterChip(this)">Mixte</button>
            </div>
        </div>
        <div class="filter-actions">
            <button class="filter-reset-btn" onclick="resetFilters()">Réinitialiser</button>
            <button class="filter-apply-btn" onclick="applyFilters()">Appliquer</button>
        </div>
    </div>

    <main class="main-content" id="mainContent"></main>

    <div class="export-footer" id="exportFooter" style="display:none">
        <button class="export-stats-btn icon-btn" id="profileBtn" onclick="window.location.href='profil-crise.html'" style="display:none">👤 Profil</button>
        <button class="export-stats-btn icon-btn" onclick="openShareExportModal('share')">✉️ Partager</button>
        <button class="export-stats-btn icon-btn" onclick="openShareExportModal('export')">📥 Exporter</button>
    </div>

    <!-- Modale profil de crise -->
    <div class="modal-overlay" id="profileModalOverlay" onclick="closeProfileModal()"></div>
    <div class="profile-modal" id="profileModal">
        <div class="profile-modal-header">
            <div class="profile-modal-title">Mon profil de crise</div>
            <button class="profile-modal-close" onclick="closeProfileModal()">×</button>
        </div>
        <div id="profileContent"></div>
        <div class="profile-modal-footer">
            <button class="profile-share-btn" onclick="shareProfile()">✉️ Partager ce profil</button>
            <button class="profile-share-btn" style="background: rgba(245,228,204,0.15); color: var(--light);" onclick="exportProfile()">📥 Exporter ce profil</button>
            <button class="export-cancel-btn" onclick="closeProfileModal()">Fermer</button>
        </div>
    </div>

    <!-- Modale export/partage -->
    <div class="modal-overlay" id="exportModalOverlay" onclick="closeExportModal()"></div>
    <div class="export-modal" id="exportModal">
        <div class="export-modal-title" id="exportModalTitle">Partager</div>
        <button class="export-option-btn" onclick="doShareExport('overview')">Vue d'ensemble</button>
        <button class="export-option-btn" onclick="doShareExport('analysis')">Analyse approfondie</button>
        <button class="export-option-btn primary" onclick="doShareExport('both')">Les deux</button>
        <button class="export-cancel-btn" onclick="closeExportModal()">Annuler</button>
    </div>

    <script src="nora-data.js"></script>
    <script>
        var currentDays = 7;
        var customFrom = null, customTo = null;
        var activeFilters = { contexte: [], origine: [], type: [], intMin: 1, intMax: 10 };

        /* ---------- INIT DEPUIS STATS.HTML ---------- */

        (function restoreNav() {
            var savedDays = localStorage.getItem('statsNavDays');
            var savedFrom = localStorage.getItem('statsNavFrom');
            var savedTo = localStorage.getItem('statsNavTo');
            var savedFilters = localStorage.getItem('statsNavFilters');

            if (savedDays !== null) {
                currentDays = parseInt(savedDays, 10);
                customFrom = savedFrom || null;
                customTo = savedTo || null;
                try { if (savedFilters) activeFilters = JSON.parse(savedFilters); } catch(e) {}
            }

            var btns = document.querySelectorAll('.period-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-days'), 10) === currentDays);
            }
            if (currentDays === 0) {
                var panel = document.getElementById('dateRangePanel');
                if (panel) panel.classList.add('visible');
                if (savedFrom) document.getElementById('dateFrom').value = savedFrom;
                if (savedTo) document.getElementById('dateTo').value = savedTo;
            }
        })();

        /* ---------- DONNÉES ---------- */

        function getJournal() {
            try { return JSON.parse(localStorage.getItem('journalCrises') || '[]'); } catch(e) { return []; }
        }

        function getProfileName(profileId) {
            var info = getContexteInfo(profileId);
            return { name: (info && info.nom) ? info.nom : (profileId || 'Inconnu'), icon: (info && info.emoji) ? info.emoji : '📍' };
        }

        function pct(part, total) { return total > 0 ? Math.round((part / total) * 100) : 0; }
        function avgArr(arr) { if (!arr.length) return null; var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return parseFloat((s / arr.length).toFixed(1)); }
        function formatMins(m) { m = Math.round(m); if (m < 60) return m + ' min'; var h = Math.floor(m/60), r = m%60; return r > 0 ? h + 'h' + (r < 10 ? '0' : '') + r : h + 'h'; }
        function parseDuration(str) {
            if (!str) return null;
            str = str.toLowerCase().trim();
            var mins = 0, found = false;
            var hMatch = str.match(/(\d+)\s*h/);
            if (hMatch) { mins += parseInt(hMatch[1], 10) * 60; found = true; }
            var mMatch = str.match(/(\d+)\s*(min|mn|m\b)/);
            if (mMatch) { mins += parseInt(mMatch[1], 10); found = true; }
            if (!found) { var n = str.match(/^(\d+)$/); if (n) { mins = parseInt(n[1], 10); found = true; } }
            return (found && mins > 0) ? mins : null;
        }

        function normDeclencheurs(arr) {
            if (!Array.isArray(arr)) return [];
            return arr.map(function(d) { return typeof d === 'string' ? { nom: d, intensite: null } : d; });
        }
        function normEnergie(e) { if (e.energie) return parseFloat(e.energie); if (e.precrisis && e.precrisis.energie !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.energie/10))); return NaN; }
        function normChargeMentale(e) { if (e.chargeMentale) return parseFloat(e.chargeMentale); if (e.precrisis && e.precrisis.chargeMentale !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.chargeMentale/10))); return NaN; }
        function normChargeSociale(e) { if (e.chargeSociale) return parseFloat(e.chargeSociale); if (e.precrisis && e.precrisis.chargeSociale !== undefined) return Math.max(1,Math.min(10,Math.round(e.precrisis.chargeSociale/10))); return NaN; }

        function countFreq(arr) {
            var freq = {}, result = [];
            for (var i = 0; i < arr.length; i++) { if (arr[i]) freq[arr[i]] = (freq[arr[i]] || 0) + 1; }
            for (var k in freq) result.push({ name: k, count: freq[k] });
            result.sort(function(a, b) { return b.count - a.count; });
            return result;
        }

        function extractLabel(item) { return item && item.label ? item.label : item; }

        function matchesFilters(entry) {
            if (activeFilters.contexte.length && activeFilters.contexte.indexOf(entry.profil || 'commun') === -1) return false;

                if (stats.trend.direction === 'up') {
                    insights.push({ priority: 1, icon: '📈',
                        text: 'L\'intensité des crises est <strong>en hausse</strong> sur la période (' + stats.trend.from + ' → ' + stats.trend.to + '/10). À surveiller.' });
                } else {
                    insights.push({ priority: 1, icon: '📉',
                        text: 'L\'intensité des crises est <strong>en baisse</strong> sur la période (' + stats.trend.from + ' → ' + stats.trend.to + '/10). Bonne évolution.' });
                }
            }

            /* Déclencheur dominant */
            if (stats.triggerStats.length > 0 && stats.triggerStats[0].count / stats.total > 0.3) {
                var topTrig = stats.triggerStats[0];
                insights.push({ priority: 2, icon: '🎯',
                    text: '<strong>' + topTrig.name + '</strong> est présent dans ' + Math.round((topTrig.count / stats.total) * 100) + '% des crises — c\'est le déclencheur le plus récurrent.' });
            }

            if (!insights.length) return '';
            insights.sort(function(a, b) { return a.priority - b.priority; });
            var topInsights = insights.slice(0, 5);
            var html = '<div class="insights-list">';
            for (var i = 0; i < topInsights.length; i++) {
                html += '<div class="insight-card"><div class="insight-icon">' + topInsights[i].icon + '</div>' +
                    '<div class="insight-text">' + topInsights[i].text + '</div></div>';
            }
            return html + '</div>';
        }

        /* ---------- RENDU RANK ROW ---------- */

        function rankRow(item, num, maxCount) {
            var barPct = Math.round((item.count / maxCount) * 100);
            var numEl = num > 0 ? '<div class="rank-number">' + num + '</div>' : '<div class="rank-number secondary">·</div>';
            var meta = item.count + '×';
            if (item.avgIntensity != null) meta += ' · ' + item.avgIntensity + '/10';
            if (item.meltdownPct != null && item.meltdownPct > 0) meta += ' · ' + item.meltdownPct + '% melt.';
            return '<div class="rank-item">' + numEl +
                '<div class="rank-bar-wrap">' +
                '<div class="rank-header"><div class="rank-name">' + item.name + '</div>' +
                '<div class="rank-meta">' + meta + '</div></div>' +
                '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + barPct + '%"></div></div>' +
                '</div></div>';
        }

        /* ---------- GRAPHIQUE EN BARRES ---------- */

        function buildBarChartSVG(entries, days, from, to) {
            var MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];
            var DAY_SHORT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
            var bucketType, startDate, endDate;
            var now = new Date();
            if (days === 7) {
                bucketType = 'daily';
                endDate = new Date(now); endDate.setHours(23,59,59,999);
                startDate = new Date(now); startDate.setDate(now.getDate() - 6); startDate.setHours(0,0,0,0);
            } else if (days === 365) {
                bucketType = 'monthly';
                endDate = new Date(now); endDate.setHours(23,59,59,999);
                startDate = new Date(now); startDate.setDate(now.getDate() - 364); startDate.setHours(0,0,0,0);
            } else {
                bucketType = 'weekly';
                if (days === 0 && from && to) {
                    startDate = new Date(from); startDate.setHours(0,0,0,0);
                    endDate = new Date(to); endDate.setHours(23,59,59,999);
                    var diffD = (endDate - startDate) / 86400000;
                    if (diffD <= 14) bucketType = 'daily';
                    else if (diffD > 200) bucketType = 'monthly';
                } else {
                    endDate = new Date(now); endDate.setHours(23,59,59,999);
                    startDate = new Date(now); startDate.setDate(now.getDate() - 29); startDate.setHours(0,0,0,0);
                }
            }
            var buckets = {}, bucketOrder = [], bucketLabels = {};
            if (bucketType === 'daily') {
                var dc = new Date(startDate);
                while (dc <= endDate) {
                    var dk = dc.toISOString().split('T')[0];
                    buckets[dk] = { count: 0, intensities: [] }; bucketOrder.push(dk);
                    bucketLabels[dk] = DAY_SHORT[dc.getDay()] + ' ' + dc.getDate();
                    dc.setDate(dc.getDate() + 1);
                }
            } else if (bucketType === 'weekly') {
                var ws = new Date(startDate), wi = 0;
                while (ws <= endDate) {
                    var wk = 'w' + wi;
                    buckets[wk] = { count: 0, intensities: [], start: new Date(ws) }; bucketOrder.push(wk);
                    bucketLabels[wk] = ws.getDate() + '/' + (ws.getMonth() + 1);
                    ws.setDate(ws.getDate() + 7); wi++;
                }
            } else {
                var ms = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
                var me = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
                var mc = new Date(ms);
                while (mc <= me) {
                    var mk = mc.getFullYear() + '-' + mc.getMonth();
                    buckets[mk] = { count: 0, intensities: [] }; bucketOrder.push(mk);
                    bucketLabels[mk] = MONTHS[mc.getMonth()];
                    mc.setMonth(mc.getMonth() + 1);
                }
            }
            for (var i = 0; i < entries.length; i++) {
                var ed = new Date(entries[i].date); var bk = null;
                if (bucketType === 'daily') { bk = ed.toISOString().split('T')[0]; }
                else if (bucketType === 'weekly') {
                    for (var bi = 0; bi < bucketOrder.length; bi++) {
                        var bs = buckets[bucketOrder[bi]].start;
                        var be = new Date(bs); be.setDate(bs.getDate() + 6);
                        if (ed >= bs && ed <= be) { bk = bucketOrder[bi]; break; }
                    }
                } else { bk = ed.getFullYear() + '-' + ed.getMonth(); }
                if (bk && buckets[bk]) {
                    buckets[bk].count++;
                    if (entries[i].intensite !== null) buckets[bk].intensities.push(entries[i].intensite);
                }
            }
            var maxCount = 0;
            for (var bi2 = 0; bi2 < bucketOrder.length; bi2++) {
                if (buckets[bucketOrder[bi2]].count > maxCount) maxCount = buckets[bucketOrder[bi2]].count;
            }
            if (!bucketOrder.length || maxCount === 0) {
                return '<div class="chart-container" style="display:flex;align-items:center;justify-content:center;min-height:80px">' +
                    '<div style="text-align:center;opacity:0.4;color:var(--dark);font-size:14px">Aucune crise sur cette période</div></div>';
            }
            var n = bucketOrder.length;
            var W = 320, H = 190, padL = 26, padR = 6, padT = 22, padB = 28;
            var chartW = W - padL - padR, chartH = H - padT - padB;
            var spacing = chartW / n, barW = Math.max(3, Math.min(22, spacing - 2));
            var barsHtml = '', labelsHtml = '', yAxisHtml = '';
            var ySteps = Math.min(maxCount, 4), ySeenVals = {};
            for (var yl = 0; yl <= ySteps; yl++) {
                var yy = padT + (yl / ySteps) * chartH;
                var yv = Math.round(maxCount * (1 - yl / ySteps));
                yAxisHtml += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="' + svgDark + '" stroke-opacity="0.07"/>';
                if (yv > 0 && !ySeenVals[yv]) { ySeenVals[yv] = true; yAxisHtml += '<text x="' + (padL - 4) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="9" fill="' + svgDark + '" opacity="0.4">' + yv + '</text>'; }
            }
            var showEvery = n > 20 ? 4 : n > 10 ? 2 : 1;
            for (var bi3 = 0; bi3 < bucketOrder.length; bi3++) {
                var bKey = bucketOrder[bi3], bd = buckets[bKey];
                var cx = padL + bi3 * spacing + spacing / 2;
                var bh = maxCount > 0 ? (bd.count / maxCount) * chartH : 0;
                var by = padT + chartH - bh;
                var ai = bd.intensities.length ? avgArr(bd.intensities) : null;
                if (bd.count > 0) {
                    barsHtml += '<rect x="' + (cx - barW / 2) + '" y="' + by + '" width="' + barW + '" height="' + bh + '" rx="2" fill="' + svgAccent + '"/>';
                    barsHtml += '<text x="' + cx + '" y="' + (by - 4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="' + svgLight + '">' + bd.count + '</text>';
                    if (ai !== null && bh > 16) barsHtml += '<text x="' + cx + '" y="' + (by + bh / 2 + 4) + '" text-anchor="middle" font-size="9" fill="' + svgDark + '" opacity="0.7">' + ai + '</text>';
                }
                if (bi3 % showEvery === 0) labelsHtml += '<text x="' + cx + '" y="' + (H - 3) + '" text-anchor="middle" font-size="9" fill="' + svgDark + '" opacity="0.45">' + bucketLabels[bKey] + '</text>';
            }
            var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + yAxisHtml + barsHtml + labelsHtml + '</svg>';
            return '<div class="chart-container">' + svg +
                '<div style="font-size:11px;color:var(--dark);opacity:0.4;text-align:center;padding-top:4px">Nombre de crises · intensité moy. à l\'intérieur</div></div>';
        }

        /* ---------- RENDU PRINCIPAL ---------- */

        function render(days, from, to) {
            var stats = computeStats(days, from, to);
            var main = document.getElementById('mainContent');

            if (!stats) {
                main.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div>' +
                    '<div class="empty-text">Aucune crise enregistrée<br>sur cette période.</div></div>';
                document.getElementById('exportFooter').style.display = 'none';
                return;
            }

            if (stats.total < 5) {
                main.innerHTML = '<div class="analysis-gate">Données insuffisantes pour l\'analyse approfondie.<br>Il faut au moins 5 crises sur la période sélectionnée.<br><br><em>Actuel : ' + stats.total + ' crise' + (stats.total > 1 ? 's' : '') + '</em></div>';
                document.getElementById('exportFooter').style.display = 'none';
                return;
            }

            var html = '';

            /* ========== RÉSUMÉ ========== */
            var resumeChips = '<div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center">';
            resumeChips += '<span style="font-size:15px;font-weight:700;color:var(--dark)">' + stats.total + ' crise' + (stats.total > 1 ? 's' : '') + '</span>';
            if (stats.avgIntensity !== null) resumeChips += '<span style="font-size:14px;color:var(--dark);opacity:0.7">intensité moy. <strong>' + stats.avgIntensity + '/10</strong></span>';
            if (stats.avgDuree !== null) resumeChips += '<span style="font-size:14px;color:var(--dark);opacity:0.7">durée moy. <strong>' + formatMins(stats.avgDuree) + '</strong></span>';
            var typeTotal = stats.meltdownCount + stats.shutdownCount;
            if (typeTotal > 0) {
                if (stats.meltdownPct >= 55) resumeChips += '<span style="font-size:14px;color:var(--dark);opacity:0.7"><strong>' + stats.meltdownPct + '%</strong> meltdown</span>';
                else if (stats.shutdownPct >= 55) resumeChips += '<span style="font-size:14px;color:var(--dark);opacity:0.7"><strong>' + stats.shutdownPct + '%</strong> shutdown</span>';
                else resumeChips += '<span style="font-size:14px;color:var(--dark);opacity:0.7"><strong>' + stats.meltdownPct + '%</strong> melt · <strong>' + stats.shutdownPct + '%</strong> shut</span>';
            }
            if (stats.avgDureeMeltdown !== null && stats.avgDureeShutdown !== null) {
                resumeChips += '<span style="font-size:12px;color:var(--dark);opacity:0.45">melt. ' + formatMins(stats.avgDureeMeltdown) + ' · shut. ' + formatMins(stats.avgDureeShutdown) + '</span>';
            }
            resumeChips += '</div>';
            html += '<div class="stat-card" style="padding:12px 14px;margin-bottom:2px">' + resumeChips + '</div>';

            /* ========== OBSERVATIONS (en premier) ========== */
            var deepHtml = buildDeepInsights(stats);
            if (deepHtml) {
                html += '<div class="section-tag">Observations</div>';
                html += deepHtml;
            }

            /* ========== ÉVOLUTION ========== */
            var barChartHtml = buildBarChartSVG(stats.timelineEntries, days, from, to);
            if (barChartHtml) {
                html += '<div class="section-tag">Évolution</div>';
                html += barChartHtml;
            }

            /* ========== DISTRIBUTION DES INTENSITÉS ========== */
            var distHtml = buildIntDistributionSVG(stats.intDistribution);
            if (distHtml) {
                html += '<div class="section-tag">Distribution</div>';
                html += distHtml;
            }

            /* ========== QUAND ? (Moments + Jours fusionnés) ========== */
            var hasHourData = stats.hourSlots && stats.hourSlots.some(function(s) { return s.count > 0; });
            var maxDayCount = 0;
            if (stats.dayOfWeek && stats.dayOfWeek.length) {
                for (var dgi = 0; dgi < stats.dayOfWeek.length; dgi++) {
                    if (stats.dayOfWeek[dgi].count > maxDayCount) maxDayCount = stats.dayOfWeek[dgi].count;
                }
            }
            if (hasHourData || maxDayCount > 0) {
                html += '<div class="section-tag">Quand ?</div>';
                if (hasHourData) {
                    html += '<div class="stat-card" style="padding:14px;margin-bottom:6px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Moment de la journée</div>';
                    html += '<div class="hour-grid">';
                    for (var hsi = 0; hsi < stats.hourSlots.length; hsi++) {
                        var hs = stats.hourSlots[hsi];
                        html += '<div class="hour-cell">' +
                            '<div class="hour-name">' + hs.name + '</div>' +
                            '<div class="hour-range">' + hs.range + '</div>' +
                            '<div class="hour-count">' + hs.count + '</div>' +
                            '</div>';
                    }
                    html += '</div></div>';
                }
                if (maxDayCount > 0) {
                    html += '<div class="stat-card" style="padding:14px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Jour de la semaine</div>';
                    html += '<div class="day-grid">';
                    for (var dgi2 = 0; dgi2 < stats.dayOfWeek.length; dgi2++) {
                        var dg = stats.dayOfWeek[dgi2];
                        html += '<div class="day-cell' + (dg.count === maxDayCount ? ' top-day' : '') + '">' +
                            '<div class="day-name">' + dg.name.slice(0, 3) + '</div>' +
                            '<div class="day-count">' + dg.count + '</div>' +
                            '</div>';
                    }
                    html += '</div></div>';
                }
            }

            /* ========== AVANT LA CRISE ========== */
            var thresholdsHtml = buildThresholdsSVG(stats.thresholds);
            var hasPrecrisisAvg = stats.avgEnergie !== null || stats.avgChargeMentale !== null || stats.avgChargeSociale !== null;
            if (thresholdsHtml || hasPrecrisisAvg) {
                html += '<div class="section-tag">Avant la crise</div>';

                /* Jauges moyennes */
                if (hasPrecrisisAvg) {
                    var precFields = [
                        { label: 'Énergie', val: stats.avgEnergie },
                        { label: 'Charge mentale', val: stats.avgChargeMentale },
                        { label: 'Charge sociale', val: stats.avgChargeSociale }
                    ];
                    html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                    html += '<div style="font-size:13px;color:var(--dark);opacity:0.5;margin-bottom:10px">Valeurs moyennes mesurées avant les crises</div>';
                    for (var pf = 0; pf < precFields.length; pf++) {
                        if (precFields[pf].val === null) continue;
                        var pct = Math.round((precFields[pf].val / 10) * 100);
                        html += '<div class="rank-item" style="margin-bottom:6px">' +
                            '<div class="rank-bar-wrap"><div class="rank-header">' +
                            '<div class="rank-name" style="font-size:15px">' + precFields[pf].label + '</div>' +
                            '<div class="rank-meta" style="font-size:15px;font-weight:700">' + precFields[pf].val + '<span style="font-size:12px;font-weight:400"> /10</span></div>' +
                            '</div><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + pct + '%"></div></div>' +
                            '</div></div>';
                    }
                    html += '</div>';
                }

                /* Graphique corrélation */
                if (thresholdsHtml) {
                    html += '<div style="font-size:13px;color:var(--light);opacity:0.5;padding:0 2px 6px">Pour chaque niveau mesuré avant la crise, quelle était l\'intensité moyenne de la crise qui a suivi</div>';
                    html += thresholdsHtml;
                }
            }

            /* ========== DÉCLENCHEURS ENRICHIS ========== */
            if (stats.triggerStats.length) {
                var trigHeader = 'Déclencheurs';
                if (stats.avgTrigPerCrise !== null) trigHeader += '<span style="font-size:12px;font-weight:500;opacity:0.5;text-transform:none;letter-spacing:0"> — moy. ' + stats.avgTrigPerCrise + '/crise</span>';
                html += '<div class="section-tag">' + trigHeader + '</div>';

                /* Catégories */
                if (stats.trigCatCounts.length > 1) {
                    html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Par catégorie</div>';
                    var maxCat = stats.trigCatCounts[0].count;
                    for (var tci = 0; tci < stats.trigCatCounts.length; tci++) {
                        html += rankRow({ name: stats.trigCatCounts[tci].name, count: stats.trigCatCounts[tci].count, avgIntensity: null, meltdownPct: null }, tci + 1, maxCat);
                    }
                    html += '</div>';
                }

                /* Déclencheurs détaillés */
                html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Tous les déclencheurs</div>';
                var maxTrig = stats.triggerStats[0].count;
                for (var ti = 0; ti < Math.min(stats.triggerStats.length, 8); ti++) {
                    html += rankRow(stats.triggerStats[ti], ti + 1, maxTrig);
                }
                html += '</div>';

                /* Déclencheurs des crises fortes (≥7) */
                if (stats.triggerStrongCrises.length) {
                    html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Dans les crises ≥ 7/10</div>';
                    var maxStrong = stats.triggerStrongCrises[0].count;
                    for (var si = 0; si < Math.min(stats.triggerStrongCrises.length, 5); si++) {
                        html += rankRow({ name: stats.triggerStrongCrises[si].name, count: stats.triggerStrongCrises[si].count, avgIntensity: null, meltdownPct: null }, si + 1, maxStrong);
                    }
                    html += '</div>';
                }

                /* Intensité perçue des déclencheurs */
                var trigWithInt = stats.triggerStats.filter(function(t) { return t.avgTrigIntensity !== null; });
                trigWithInt.sort(function(a, b) { return b.avgTrigIntensity - a.avgTrigIntensity; });
                if (trigWithInt.length >= 3) {
                    html += '<div class="stat-card" style="padding:12px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Intensité perçue des déclencheurs</div>';
                    html += '<div style="font-size:11px;color:var(--dark);opacity:0.4;margin-bottom:8px">À quel point ce stimulus était intense, selon ton ressenti au moment de la crise</div>';
                    for (var twi = 0; twi < Math.min(trigWithInt.length, 5); twi++) {
                        var ti2 = trigWithInt[twi];
                        var barPct2 = Math.round((ti2.avgTrigIntensity / 10) * 100);
                        html += '<div class="rank-item"><div class="rank-number">' + (twi + 1) + '</div>' +
                            '<div class="rank-bar-wrap"><div class="rank-header">' +
                            '<div class="rank-name">' + ti2.name + '</div>' +
                            '<div class="rank-meta">' + ti2.avgTrigIntensity + '/10</div></div>' +
                            '<div class="rank-bar-bg"><div class="rank-bar-fill" style="width:' + barPct2 + '%"></div></div>' +
                            '</div></div>';
                    }
                    html += '</div>';
                }
            }

            /* ========== IMPACT (Besoins + États + Capacités) ========== */
            var hasBesoins = stats.besoinsCounts.length > 0;
            var hasEtats = stats.etatCounts.length > 0;
            var hasCaps = stats.capImpCounts.length > 0 || stats.capDifCounts.length > 0;
            if (hasBesoins || hasEtats || hasCaps) {
                html += '<div class="section-tag">Impact</div>';
                if (hasBesoins) {
                    html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Besoins pendant la crise</div>';
                    var maxBesoin = stats.besoinsCounts[0].count;
                    for (var bbi = 0; bbi < Math.min(stats.besoinsCounts.length, 7); bbi++) {
                        html += rankRow({ name: stats.besoinsCounts[bbi].name, count: stats.besoinsCounts[bbi].count, avgIntensity: null, meltdownPct: null }, bbi + 1, maxBesoin);
                    }
                    html += '</div>';
                }
                if (hasEtats) {
                    html += '<div class="stat-card" style="padding:12px;margin-bottom:6px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">États ressentis</div>';
                    var maxEtat = stats.etatCounts[0].count;
                    for (var ei = 0; ei < Math.min(stats.etatCounts.length, 7); ei++) {
                        var et = stats.etatCounts[ei];
                        var eAvgI = stats.avgIntensityByEtat[et.name];
                        html += rankRow({ name: et.name, count: et.count, avgIntensity: eAvgI, meltdownPct: null }, ei + 1, maxEtat);
                    }
                    html += '</div>';
                }
                if (hasCaps) {
                    html += '<div class="stat-card" style="padding:12px">';
                    html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--dark);opacity:0.5;margin-bottom:8px">Capacités impactées</div>';
                    if (stats.capImpCounts.length) {
                        html += '<div class="cap-category">Impossible</div>';
                        var maxImp = stats.capImpCounts[0].count;
                        for (var ci = 0; ci < Math.min(stats.capImpCounts.length, 7); ci++) {
                            html += rankRow({ name: stats.capImpCounts[ci].name, count: stats.capImpCounts[ci].count, avgIntensity: null, meltdownPct: null }, ci + 1, maxImp);
                        }
                    }
                    if (stats.capDifCounts.length) {
                        html += '<div class="cap-category cap-sep">Souvent difficile</div>';
                        var maxDif = stats.capDifCounts[0].count;
                        for (var cdi = 0; cdi < Math.min(stats.capDifCounts.length, 7); cdi++) {
                            html += rankRow({ name: stats.capDifCounts[cdi].name, count: stats.capDifCounts[cdi].count, avgIntensity: null, meltdownPct: null }, cdi + 1, maxDif);
                        }
                    }
                    html += '</div>';
                }
            }

            /* ========== CONTEXTES ========== */
            if (stats.profileCounts.length > 1) {
                html += '<div class="section-tag">Contextes</div>';
                html += '<div class="stat-card" style="padding:12px">';
                var maxCtx = stats.profileCounts[0].count;
                for (var pc = 0; pc < stats.profileCounts.length; pc++) {
                    var prof = stats.profileCounts[pc];
                    var pInfo = getProfileName(prof.name);
                    var pAvgInt = stats.avgIntensityByContexte[pInfo.name];
                    var pType = stats.percentTypeByContexte[pInfo.name];
                    html += rankRow({
                        name: pInfo.icon + ' ' + pInfo.name,
                        count: prof.count,
                        avgIntensity: (pAvgInt !== null && pAvgInt !== undefined) ? pAvgInt : null,
                        meltdownPct: (pType && pType.meltdown > 0) ? pType.meltdown : null
                    }, pc + 1, maxCtx);
                }
                html += '</div>';
            }

            main.innerHTML = html;
            document.getElementById('exportFooter').style.display = 'flex';
        }

        /* ---------- EXPORT ---------- */

        function getPeriodLabel() {
            return currentDays === 7 ? '7 derniers jours' : currentDays === 30 ? '30 derniers jours' :
                currentDays === 365 ? 'dernière année' : 'du ' + customFrom + ' au ' + customTo;
        }

        function downloadText(text) {
            var blob = new Blob([text], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url;
            a.download = 'analyse-nora-' + new Date().toISOString().split('T')[0] + '.txt';
            a.click(); URL.revokeObjectURL(url);
        }

        /* ---------- PROFIL DE CRISE ---------- */

        function computeProfileStats() {
            var journal = getJournal();
            if (journal.length < 10) return null;
            var intensities = [], energies = [], chargesMentales = [], chargesSociales = [], durees = [];
            var triggerFreq = {}, besoinArr = [], meltdownCount = 0, shutdownCount = 0;
            var hourCounts = [0, 0, 0, 0];
            for (var k = 0; k < journal.length; k++) {
                var e = journal[k];
                var iv = parseFloat(e.intensite); if (!isNaN(iv)) intensities.push(iv);
                var en = normEnergie(e); if (!isNaN(en)) energies.push(en);
                var cm = normChargeMentale(e); if (!isNaN(cm)) chargesMentales.push(cm);
                var cs = normChargeSociale(e); if (!isNaN(cs)) chargesSociales.push(cs);
                if (e.typeManifestation === 'Meltdown') meltdownCount++;
                else if (e.typeManifestation === 'Shutdown') shutdownCount++;
                var decl = normDeclencheurs(e.declencheurs);
                for (var d2 = 0; d2 < decl.length; d2++) { if (decl[d2].nom) triggerFreq[decl[d2].nom] = (triggerFreq[decl[d2].nom] || 0) + 1; }
                var bess = e.besoins || [];
                for (var be2 = 0; be2 < bess.length; be2++) { var bl = extractLabel(bess[be2]); if (bl) besoinArr.push(bl); }
                if (e.horodatage) { var hh = new Date(e.horodatage).getHours(); hourCounts[hh < 6 ? 0 : hh < 12 ? 1 : hh < 18 ? 2 : 3]++; }
                if (e.duree) { var dm = parseDuration(e.duree); if (dm !== null) durees.push(dm); }
            }
            var trigCatFreq = {};
            for (var tk in triggerFreq) { var parts = tk.split(' — '); var cat = parts.length > 1 ? parts[0] : 'Divers'; trigCatFreq[cat] = (trigCatFreq[cat] || 0) + triggerFreq[tk]; }
            var trigCatCounts = [];
            for (var tc in trigCatFreq) trigCatCounts.push({ name: tc, count: trigCatFreq[tc] });
            trigCatCounts.sort(function(a, b) { return b.count - a.count; });
            var triggerStats = [];
            for (var tkey in triggerFreq) triggerStats.push({ name: tkey, count: triggerFreq[tkey] });
            triggerStats.sort(function(a, b) { return b.count - a.count; });
            var hourSlotNames = ['Nuit (0–6h)', 'Matin (6–12h)', 'Après-midi (12–18h)', 'Soir (18–24h)'];
            var maxHourIdx = 0;
            for (var hi = 1; hi < 4; hi++) { if (hourCounts[hi] > hourCounts[maxHourIdx]) maxHourIdx = hi; }
            return {
                total: journal.length,
                avgIntensity: avgArr(intensities),
                avgEnergie: avgArr(energies), avgChargeMentale: avgArr(chargesMentales), avgChargeSociale: avgArr(chargesSociales),
                avgDuree: durees.length ? avgArr(durees) : null,
                meltdownCount: meltdownCount, shutdownCount: shutdownCount,
                meltdownPct: pct(meltdownCount, meltdownCount + shutdownCount),
                shutdownPct: pct(shutdownCount, meltdownCount + shutdownCount),
                triggerStats: triggerStats.slice(0, 5), trigCatCounts: trigCatCounts,
                besoinsCounts: countFreq(besoinArr).slice(0, 5),
                dominantSlot: hourCounts[maxHourIdx] > 0 ? { name: hourSlotNames[maxHourIdx], pct: pct(hourCounts[maxHourIdx], journal.length) } : null
            };
        }

        function buildProfileHTML(ps) {
            var html = '';

            // Description + baseline
            html += '<div style="font-size:14px;color:rgba(245,228,204,0.65);line-height:1.55;margin-bottom:6px">';
            html += 'Ce profil résume tes tendances de crise en chiffres clés. Toutes les valeurs sont des moyennes calculées sur l\'ensemble de ton historique, sans filtres.';
            html += '</div>';
            html += '<div style="font-size:12px;color:rgba(245,228,204,0.35);margin-bottom:8px">Basé sur ' + ps.total + ' crises enregistrées</div>';

            // Résumé — insight
            html += '<div class="profile-section-title">Résumé</div><div class="profile-card">';
            var resumeParts = [];
            if (ps.avgIntensity !== null) resumeParts.push('une intensité moyenne de <strong>' + ps.avgIntensity + '/10</strong>');
            var typeTotal = ps.meltdownCount + ps.shutdownCount;
            if (typeTotal >= 3) {
                if (ps.meltdownPct >= 55) resumeParts.push('un profil majoritairement <strong>meltdown</strong> (' + ps.meltdownPct + '% des crises typées)');
                else if (ps.shutdownPct >= 55) resumeParts.push('un profil majoritairement <strong>shutdown</strong> (' + ps.shutdownPct + '% des crises typées)');
                else resumeParts.push('un profil <strong>mixte</strong> (' + ps.meltdownPct + '% meltdown · ' + ps.shutdownPct + '% shutdown)');
            }
            if (resumeParts.length > 0) {
                html += '<div class="profile-line">Tes crises présentent ' + resumeParts.join(' et ') + '.</div>';
            }
            if (ps.avgDuree !== null) html += '<div class="profile-line">Elles durent en moyenne <strong>' + formatMins(ps.avgDuree) + '</strong>.</div>';
            html += '</div>';

            // Schémas récurrents (ex "Patterns habituels") — déplacé sous Résumé
            var hasPrecrisis = ps.avgEnergie !== null || ps.avgChargeMentale !== null || ps.avgChargeSociale !== null;
            if (hasPrecrisis || ps.dominantSlot) {
                html += '<div class="profile-section-title">Schémas récurrents</div><div class="profile-card">';
                if (ps.dominantSlot) {
                    html += '<div class="profile-line">Elles surviennent surtout <strong>' + ps.dominantSlot.name + '</strong> (' + ps.dominantSlot.pct + '% des crises).</div>';
                }
                if (hasPrecrisis) {
                    var precrisisParts = [];
                    if (ps.avgEnergie !== null) precrisisParts.push('énergie à <strong>' + ps.avgEnergie + '/10</strong>');
                    if (ps.avgChargeMentale !== null) precrisisParts.push('charge mentale à <strong>' + ps.avgChargeMentale + '/10</strong>');
                    if (ps.avgChargeSociale !== null) precrisisParts.push('charge sociale à <strong>' + ps.avgChargeSociale + '/10</strong>');
                    html += '<div class="profile-line">Avant la crise, en moyenne : ' + precrisisParts.join(', ') + '.</div>';
                }
                html += '</div>';
            }

            // Déclencheurs fréquents
            if (ps.triggerStats.length) {
                html += '<div class="profile-section-title">Déclencheurs fréquents</div><div class="profile-card">';
                if (ps.trigCatCounts.length > 1) {
                    html += '<div class="profile-line" style="font-size:13px;opacity:0.6">Catégories : ' + ps.trigCatCounts.map(function(c) { return c.name; }).join(' · ') + '</div>';
                }
                for (var ti = 0; ti < Math.min(ps.triggerStats.length, 3); ti++) {
                    html += '<div class="profile-line"><strong>' + (ti+1) + '.</strong> ' + ps.triggerStats[ti].name + '</div>';
                }
                html += '</div>';
            }

            // Besoins
            if (ps.besoinsCounts.length) {
                html += '<div class="profile-section-title">Besoins pendant la crise</div><div class="profile-card">';
                for (var bi = 0; bi < ps.besoinsCounts.length; bi++) {
                    html += '<div class="profile-line"><strong>' + (bi+1) + '.</strong> ' + ps.besoinsCounts[bi].name + '</div>';
                }
                html += '</div>';
            }

            return html;
        }

        function buildProfileText(ps) {
            var text = '== Mon profil de crise — Nora ==\n';
            text += 'Basé sur ' + ps.total + ' crises enregistrées (toutes crises, sans filtres)\n';
            text += 'Toutes les valeurs sont des moyennes.\n\n';

            text += '— Résumé —\n';
            var resumeParts = [];
            if (ps.avgIntensity !== null) resumeParts.push('intensité moyenne ' + ps.avgIntensity + '/10');
            var typeTotal = ps.meltdownCount + ps.shutdownCount;
            if (typeTotal >= 3) {
                if (ps.meltdownPct >= 55) resumeParts.push('profil majoritairement meltdown (' + ps.meltdownPct + '% des crises typées)');
                else if (ps.shutdownPct >= 55) resumeParts.push('profil majoritairement shutdown (' + ps.shutdownPct + '% des crises typées)');
                else resumeParts.push('profil mixte (' + ps.meltdownPct + '% meltdown / ' + ps.shutdownPct + '% shutdown)');
            }
            if (resumeParts.length) text += 'Tes crises présentent : ' + resumeParts.join(', ') + '.\n';
            if (ps.avgDuree !== null) text += 'Durée moyenne : ' + formatMins(ps.avgDuree) + '\n';

            var hasPrecrisis = ps.avgEnergie !== null || ps.avgChargeMentale !== null || ps.avgChargeSociale !== null;
            if (hasPrecrisis || ps.dominantSlot) {
                text += '\n— Schémas récurrents —\n';
                if (ps.dominantSlot) text += 'Moment habituel : ' + ps.dominantSlot.name + ' (' + ps.dominantSlot.pct + '% des crises)\n';
                if (ps.avgEnergie !== null) text += 'Énergie avant crise (moy.) : ' + ps.avgEnergie + '/10\n';
                if (ps.avgChargeMentale !== null) text += 'Charge mentale (moy.) : ' + ps.avgChargeMentale + '/10\n';
                if (ps.avgChargeSociale !== null) text += 'Charge sociale (moy.) : ' + ps.avgChargeSociale + '/10\n';
            }
            if (ps.triggerStats.length) {
                text += '\n— Déclencheurs fréquents —\n';
                if (ps.trigCatCounts.length > 1) text += 'Catégories : ' + ps.trigCatCounts.map(function(c) { return c.name; }).join(', ') + '\n';
                for (var ti = 0; ti < Math.min(ps.triggerStats.length, 3); ti++) text += (ti+1) + '. ' + ps.triggerStats[ti].name + '\n';
            }
            if (ps.besoinsCounts.length) {
                text += '\n— Besoins pendant la crise —\n';
                for (var bi = 0; bi < ps.besoinsCounts.length; bi++) text += (bi+1) + '. ' + ps.besoinsCounts[bi].name + '\n';
            }
            text += '\nGénéré le ' + new Date().toLocaleDateString('fr-FR') + ' — Nora.';
            return text;
        }

        function openProfileModal() {
            var ps = computeProfileStats();
            if (!ps) return;
            var content = document.getElementById('profileContent');
            content.innerHTML = buildProfileHTML(ps);
            content.scrollTop = 0;
            document.getElementById('profileModalOverlay').classList.add('visible');
            setTimeout(function() { document.getElementById('profileModal').classList.add('visible'); }, 10);
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('visible');
            document.getElementById('profileModalOverlay').classList.remove('visible');
        }

        function shareProfile() {
            var ps = computeProfileStats();
            if (!ps) return;
            var text = buildProfileText(ps);
            if (navigator.share) {
                navigator.share({ title: 'Mon profil de crise — Nora', text: text }).catch(function() {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { alert('Profil copié !'); }).catch(function() {});
            }
        }

        function exportProfile() {
            var ps = computeProfileStats();
            if (!ps) return;
            var text = buildProfileText(ps);
            var blob = new Blob([text], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'profil-crise-nora.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        /* ---------- FILTRES ---------- */

        function initFilterContextes() {
            var journal = getJournal(), profils = {};
            for (var i = 0; i < journal.length; i++) profils[journal[i].profil || 'commun'] = true;
            var container = document.getElementById('filterContexte');
            container.innerHTML = '';
            for (var key in profils) {
                var info = getProfileName(key);
                var btn = document.createElement('button');
                btn.className = 'filter-chip';
                btn.setAttribute('data-val', key);
                btn.textContent = info.icon + ' ' + info.name;
                if (activeFilters.contexte.indexOf(key) !== -1) btn.classList.add('selected');
                btn.onclick = function() { toggleFilterChip(this); };
                container.appendChild(btn);
            }
            var fixed = document.querySelectorAll('#filterOrigine .filter-chip, #filterType .filter-chip');
            for (var j = 0; j < fixed.length; j++) {
                var g = fixed[j].getAttribute('data-val');
                var group = fixed[j].parentElement.id === 'filterOrigine' ? activeFilters.origine : activeFilters.type;
                if (group.indexOf(g) !== -1) fixed[j].classList.add('selected');
            }
        }

        function toggleFilterChip(el) { el.classList.toggle('selected'); }

        function toggleFilterPanel() {
            document.getElementById('filterOverlay').classList.add('visible');
            setTimeout(function() { document.getElementById('filterPanel').classList.add('visible'); }, 10);
        }

        function closeFilterPanel() {
            document.getElementById('filterPanel').classList.remove('visible');
            document.getElementById('filterOverlay').classList.remove('visible');
        }

        function getSelectedChips(containerId) {
            var chips = document.querySelectorAll('#' + containerId + ' .filter-chip.selected'), vals = [];
            for (var i = 0; i < chips.length; i++) vals.push(chips[i].getAttribute('data-val'));
            return vals;
        }

        function applyFilters() {
            activeFilters.contexte = getSelectedChips('filterContexte');
            activeFilters.origine = getSelectedChips('filterOrigine');
            activeFilters.type = getSelectedChips('filterType');
            updateFilterBadge();
            closeFilterPanel();
            renderCurrent();
        }

        function resetFilters() {
            var chips = document.querySelectorAll('.filter-chip.selected');
            for (var i = 0; i < chips.length; i++) chips[i].classList.remove('selected');
            activeFilters = { contexte: [], origine: [], type: [], intMin: 1, intMax: 10 };
            updateFilterBadge(); closeFilterPanel(); renderCurrent();
        }

        function updateFilterBadge() {
            var count = activeFilters.contexte.length + activeFilters.origine.length + activeFilters.type.length;
            var badge = document.getElementById('filterBadge'), btn = document.getElementById('filterBtn');
            if (count > 0) { badge.textContent = count; badge.style.display = 'inline'; btn.classList.add('has-filters'); }
            else { badge.style.display = 'none'; btn.classList.remove('has-filters'); }
        }

        /* ---------- PÉRIODE ---------- */

        function saveNav() {
            localStorage.setItem('statsNavDays', currentDays);
            localStorage.setItem('statsNavFrom', customFrom || '');
            localStorage.setItem('statsNavTo', customTo || '');
            localStorage.setItem('statsNavFilters', JSON.stringify(activeFilters));
        }

        function selectPeriod(days) {
            currentDays = days;
            var btns = document.querySelectorAll('.period-btn');
            for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-days'), 10) === days);
            var panel = document.getElementById('dateRangePanel');
            if (days === 0) panel.classList.add('visible');
            else { panel.classList.remove('visible'); saveNav(); renderCurrent(); }
        }

        function applyCustomRange() {
            var from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            if (!from || !to) { alert('Choisis une date de début et une date de fin.'); return; }
            if (from > to) { alert('La date de début doit être avant la date de fin.'); return; }
            customFrom = from; customTo = to; saveNav(); renderCurrent();
        }

        function renderCurrent() {
            try { render(currentDays, customFrom, customTo); }
            catch (err) {
                console.error('Analyse render error:', err);
                document.getElementById('mainContent').innerHTML =
                    '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement.<br>Réessaie.</div></div>';
            }
        }

        /* ---------- EXPORT / PARTAGE ---------- */

        var _exportMode = 'share';

        function openShareExportModal(mode) {
            _exportMode = mode;
            document.getElementById('exportModalTitle').textContent = mode === 'share' ? 'Partager' : 'Exporter';
            document.getElementById('exportModalOverlay').classList.add('visible');
            document.getElementById('exportModal').classList.add('visible');
        }

        function closeExportModal() {
            document.getElementById('exportModalOverlay').classList.remove('visible');
            document.getElementById('exportModal').classList.remove('visible');
        }

        function buildOverviewText(stats) {
            var text = '== Statistiques Nora — ' + getPeriodLabel() + ' ==\n\n';
            text += 'Crises : ' + stats.total + '\n';
            if (stats.avgIntensity !== null) text += 'Intensité moyenne : ' + stats.avgIntensity + '/10\n';
            if (stats.meltdownPct > 0 || stats.shutdownPct > 0) text += 'Meltdown / Shutdown : ' + stats.meltdownPct + '% / ' + stats.shutdownPct + '%\n';
            if (stats.avgEnergie !== null) text += 'Énergie moy. avant crise : ' + stats.avgEnergie + '/10\n';
            if (stats.avgChargeMentale !== null) text += 'Charge mentale moy. : ' + stats.avgChargeMentale + '/10\n';
            if (stats.avgChargeSociale !== null) text += 'Charge sociale moy. : ' + stats.avgChargeSociale + '/10\n';
            if (stats.triggerStats.length) {
                text += '\nDéclencheurs :\n';
                for (var ti = 0; ti < Math.min(stats.triggerStats.length, 5); ti++) text += '  ' + (ti + 1) + '. ' + stats.triggerStats[ti].name + ' (' + stats.triggerStats[ti].count + ' fois)\n';
            }
            if (stats.etatCounts.length) {
                text += '\nÉtats :\n';
                for (var ei = 0; ei < Math.min(stats.etatCounts.length, 5); ei++) text += '  ' + (ei + 1) + '. ' + stats.etatCounts[ei].name + ' (' + stats.etatCounts[ei].count + ' fois)\n';
            }
            if (stats.capImpCounts.length) {
                text += '\nCapacités impossibles :\n';
                for (var ii = 0; ii < Math.min(stats.capImpCounts.length, 5); ii++) text += '  ' + (ii + 1) + '. ' + stats.capImpCounts[ii].name + ' (' + stats.capImpCounts[ii].count + ' fois)\n';
            }
            text += '\nExport du ' + new Date().toLocaleDateString('fr-FR') + ' — Nora.';
            return text;
        }

        function buildAnalysisText(stats) {
            var text = '== Analyse approfondie Nora — ' + getPeriodLabel() + ' ==\n\n';
            text += 'Crises : ' + stats.total + '\n';
            if (stats.avgIntensity !== null) text += 'Intensité moyenne : ' + stats.avgIntensity + '/10\n';
            if (stats.meltdownPct > 0 || stats.shutdownPct > 0) text += 'Meltdown / Shutdown : ' + stats.meltdownPct + '% / ' + stats.shutdownPct + '%\n';
            if (stats.profileCounts.length > 1) {
                text += '\nContextes :\n';
                for (var pc = 0; pc < stats.profileCounts.length; pc++) {
                    var pn = getProfileName(stats.profileCounts[pc].name);
                    var pAvg = stats.avgIntensityByContexte[pn.name];
                    text += '  ' + pn.icon + ' ' + pn.name + ' : ' + stats.profileCounts[pc].count + ' crises';
                    if (pAvg !== null && pAvg !== undefined) text += ' · intensité ' + pAvg + '/10';
                    text += '\n';
                }
            }
            if (stats.triggerStats.length) {
                text += '\nDéclencheurs :\n';
                for (var ti = 0; ti < Math.min(stats.triggerStats.length, 8); ti++) {
                    var tr = stats.triggerStats[ti];
                    text += '  ' + (ti + 1) + '. ' + tr.name + ' (' + tr.count + '×';
                    if (tr.avgIntensity !== null) text += ' · ' + tr.avgIntensity + '/10';
                    text += ')\n';
                }
            }
            if (stats.etatCounts.length) {
                text += '\nÉtats :\n';
                for (var ei = 0; ei < Math.min(stats.etatCounts.length, 7); ei++) {
                    var et = stats.etatCounts[ei];
                    var eAvg = stats.avgIntensityByEtat[et.name];
                    text += '  ' + (ei + 1) + '. ' + et.name + ' (' + et.count + '×';
                    if (eAvg !== null) text += ' · ' + eAvg + '/10';
                    text += ')\n';
                }
            }
            if (stats.capImpCounts.length) {
                text += '\nCapacités impossibles :\n';
                for (var ci = 0; ci < Math.min(stats.capImpCounts.length, 5); ci++) text += '  ' + stats.capImpCounts[ci].name + ' (' + stats.capImpCounts[ci].count + '×)\n';
            }
            if (stats.capDifCounts.length) {
                text += '\nSouvent difficile :\n';
                for (var cdi = 0; cdi < Math.min(stats.capDifCounts.length, 5); cdi++) text += '  ' + stats.capDifCounts[cdi].name + ' (' + stats.capDifCounts[cdi].count + '×)\n';
            }
            text += '\nExport du ' + new Date().toLocaleDateString('fr-FR') + ' — Nora.';
            return text;
        }

        function doShareExport(which) {
            closeExportModal();
            var stats = computeStats(currentDays, customFrom, customTo);
            if (!stats) { alert('Aucune donnée sur cette période.'); return; }
            var text = which === 'overview' ? buildOverviewText(stats)
                     : which === 'analysis' ? buildAnalysisText(stats)
                     : buildOverviewText(stats) + '\n\n---\n\n' + buildAnalysisText(stats);
            if (_exportMode === 'share') {
                if (navigator.share) {
                    navigator.share({ title: 'Statistiques Nora', text: text }).catch(function() {});
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() { alert('Résumé copié !'); }).catch(function() { downloadText(text); });
                } else { downloadText(text); }
            } else {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() { alert('Données copiées !'); }).catch(function() { downloadText(text); });
                } else { downloadText(text); }
            }
        }

        initFilterContextes();
        if (getJournal().length >= 10) document.getElementById('profileBtn').style.display = '';
        renderCurrent();

        (function() {
            var startX, startY;
            document.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });
            document.addEventListener('touchend', function(e) {
                if (startX === undefined) return;
                var dx = e.changedTouches[0].clientX - startX;
                var dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
                    if (dx > 0) window.location.href = 'stats.html';
                }
                startX = undefined;
            }, { passive: true });
        })();
    </script>

    <script src="nora-scroll.js"></script>
</body>
</html>
