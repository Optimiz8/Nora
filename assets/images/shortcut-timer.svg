  <rect x="246" y="414" width="20" height="32" rx="10" fill="rgba(245,228,204,0.4)"/>
  <rect x="102" y="274" width="32" height="20" rx="10" fill="rgba(245,228,204,0.4)"/>
  <rect x="378" y="274" width="32" height="20" rx="10" fill="rgba(245,228,204,0.4)"/>
  <!-- Aiguille minute (vers 12) -->
