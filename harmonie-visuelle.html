<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Nora - Harmonie visuelle</title>
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            overflow: hidden;
            height: 100%;
            margin: 0;
        }

        .main-f {
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: var(--footer-height);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2129;
        }

        .container {
            width: 85%; 
            height: 85%; 
            display: flex; 
            flex-direction: column;
            justify-content: space-around; 
            align-items: center;
        }

        .bar {
            width: 100%; 
            height: 1px;
            background: rgba(245, 228, 204, 0.08);
            position: relative;
        }

        .dot {
            position: absolute;
            height: 16px;
            width: 16px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            top: -8px;
            left: 0;
            will-change: transform;
        }

        #glitterCanvas {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" onclick="if(localStorage.getItem('calmSource')==='recap'){localStorage.removeItem('calmSource');location.href='recap.html'}else{location.href='index.html#calm'}" aria-label="Retour">⬅️</button>
        <h1 class="page-title">Harmonie visuelle</h1>
        <button class="header-icon" onclick="location.href='index.html'" style="margin-left: auto;" aria-label="Accueil">🏠</button>
    </header>

    <main class="main-f">
        <canvas id="glitterCanvas"></canvas>
        <div class="container" id="barContainer"></div>
    </main>

    <footer class="footer">
        <button id="modeBtn" class="footer-button center" onclick="nextMode()">Mode 1</button>
        <button class="footer-button center" onclick="changeSpeed()">Vitesse : <span id="speedTxt">1x</span></button>
    </footer>

    <script>
        const container = document.getElementById('barContainer');
        const modeBtn = document.getElementById('modeBtn');
        const speedTxt = document.getElementById('speedTxt');
        const count = 18; 
        
        // RECALIBRAGE : 0.9 est la nouvelle base "1x" (équivalent à l'ancien 1.5x)
        const levels = [0.15, 0.45, 0.9, 1.35, 1.8];
        const names = ["0.2x", "0.5x", "1x", "1.5x", "2x"];
        let speedIndex = 2; // Index de "1x"
        let speed = levels[speedIndex];
        
        let currentMode = 0;
        const dots = [];

        /* ---------- PAILLETTES ---------- */
        const glitterCanvas = document.getElementById('glitterCanvas');
        const glitterCtx = glitterCanvas.getContext('2d');
        const GLITTER_COLORS = [
            '#FFD700', '#FFF0AA', '#FFFDE0', // ors et jaunes
            '#FF9ECD', '#FF69B4', '#FFB6D9', // roses
            '#C8A8FF', '#A07AFF',             // violets
            '#7FDBFF', '#B0EEFF',             // bleus clairs
            '#FFFFFF', '#F5E4CC'              // blanc et crème
        ];
        let glitterParticles = [];
        let glitterReady = false;

        function resizeGlitterCanvas() {
            glitterCanvas.width = glitterCanvas.offsetWidth;
            glitterCanvas.height = glitterCanvas.offsetHeight;
            glitterParticles = []; // Réinitialiser après resize
        }

        function spawnGlitter() {
            const spawnRate = Math.max(3, Math.round(6 * speed));
            for (let s = 0; s < spawnRate; s++) {
                glitterParticles.push({
                    x: Math.random() * glitterCanvas.width,
                    y: Math.random() * glitterCanvas.height,
                    size: Math.random() * 1.2 + 0.3,
                    color: GLITTER_COLORS[Math.floor(Math.random() * GLITTER_COLORS.length)],
                    alpha: 0,
                    maxAlpha: Math.random() * 0.8 + 0.2,
                    decay: (Math.random() * 0.012 + 0.006) * speed,
                    growing: true,
                    vx: (Math.random() - 0.5) * 0.3 * speed,
                    vy: (Math.random() - 0.5) * 0.3 * speed
                });
            }
            if (glitterParticles.length > 600) glitterParticles.splice(0, glitterParticles.length - 600);
        }

        function drawGlitter() {
            // Redimensionner le canvas si nécessaire (corrige l'effet ovale)
            if (!glitterReady || glitterCanvas.width !== glitterCanvas.offsetWidth || glitterCanvas.height !== glitterCanvas.offsetHeight) {
                resizeGlitterCanvas();
                glitterReady = true;
            }
            glitterCtx.clearRect(0, 0, glitterCanvas.width, glitterCanvas.height);
            spawnGlitter();
            glitterParticles = glitterParticles.filter(p => p.alpha > 0 || p.growing);
            glitterParticles.forEach(p => {
                glitterCtx.save();
                glitterCtx.globalAlpha = Math.min(p.alpha, p.maxAlpha);
                glitterCtx.fillStyle = p.color;
                glitterCtx.shadowBlur = 4;
                glitterCtx.shadowColor = p.color;
                glitterCtx.beginPath();
                glitterCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                glitterCtx.fill();
                glitterCtx.restore();
                if (p.growing) {
                    p.alpha += p.decay;
                    if (p.alpha >= p.maxAlpha) p.growing = false;
                } else {
                    p.alpha -= p.decay * 0.7;
                }
                p.x += p.vx;
                p.y += p.vy;
            });
        }

        for (let i = 0; i < count; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            const dot = document.createElement('div');
            dot.className = 'dot';
            bar.appendChild(dot);
            container.appendChild(bar);
            dots.push({ el: dot, index: i });
        }

        const modeNames = ['Mode 1', 'Mode 2', 'Mode 3', 'Mode 4', 'Mode 5', 'Paillettes ✨'];

        function nextMode() {
            currentMode = (currentMode + 1) % 6;
            modeBtn.innerText = modeNames[currentMode];
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function changeSpeed() {
            speedIndex = (speedIndex + 1) % levels.length;
            speed = levels[speedIndex];
            speedTxt.innerText = names[speedIndex];
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function animate(time) {
            if (currentMode === 5) {
                container.style.display = 'none';
                glitterCanvas.style.display = 'block';
                drawGlitter();
                requestAnimationFrame(animate);
                return;
            }

            container.style.display = 'flex';
            glitterCanvas.style.display = 'none';

            const t = (time / 1000) * speed;
            const width = container.offsetWidth - 16;

            dots.forEach((dot, i) => {
                let pos;

                if (currentMode === 0) {
                    // Mode 1: Harmonie
                    const frequency = (10 + i) / 10;
                    pos = (Math.sin(t * frequency) + 1) / 2;
                }
                else if (currentMode === 1) {
                    // Mode 2: Cascade
                    pos = (Math.sin(t * 2.5 - i * 0.35) + 1) / 2;
                }
                else if (currentMode === 2) {
                    // Mode 3: Miroir
                    const dir = i % 2 === 0 ? 1 : -1;
                    pos = (Math.sin(t * 2.2 * dir) + 1) / 2;
                }
                else if (currentMode === 3) {
                    // Mode 4: ADN
                    const speedMult = 2.2;
                    const wave = Math.sin(t * speedMult + (i * 0.5));
                    const perspective = Math.cos(t * speedMult + (i * 0.5));
                    const side = (i % 2 === 0) ? 1 : -1;

                    pos = 0.5 + (wave * 0.35 * side);
                    dot.el.style.opacity = 0.3 + (perspective + 1) * 0.35;
                }
                else {
                    // Mode 5: Spirale
                    const rotation = Math.sin(t * 2.2 + (i * 0.3));
                    const perspective = Math.cos(t * 2.2 + (i * 0.3));

                    pos = (rotation + 1) / 2;
                    dot.el.style.opacity = 0.2 + (perspective + 1) * 0.4;
                }

                dot.el.style.transform = `translateX(${pos * width}px)`;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            if (currentMode === 5) resizeGlitterCanvas();
        });

        requestAnimationFrame(animate);

        // Wake lock : empêcher la mise en veille pendant 30 minutes
        let wakeLock = null;
        const WAKE_LOCK_DURATION = 15 * 60 * 1000;

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                setTimeout(() => {
                    if (wakeLock) { wakeLock.release(); wakeLock = null; }
                }, WAKE_LOCK_DURATION);
            } catch (e) { /* non supporté ou refusé */ }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && !wakeLock) {
                await requestWakeLock();
            }
        });

        requestWakeLock();
    </script>

</body>
</html>
