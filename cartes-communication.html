<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Cartes de communication</title>
    <style>
        .main-content {
            padding: 20px 16px calc(var(--footer-height) + 20px);
        }

        .intro-text {
            font-size: 17px;
            color: rgba(245, 228, 204, 0.75);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        /* ---------- TOGGLE ICONS ---------- */
        .icons-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(245, 228, 204, 0.07);
            border: 1.5px solid rgba(245, 228, 204, 0.12);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .icons-toggle-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--light);
        }

        .toggle-switch {
            width: 48px;
            height: 28px;
            background: rgba(46, 58, 89, 0.4);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-knob {
            transform: translateX(20px);
        }

        /* ---------- CARD GRID ---------- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .com-card {
            background-color: var(--light);
            border-radius: 14px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s;
            min-height: 90px;
            position: relative;
        }

        .com-card:active {
            transform: scale(0.96);
        }

        .card-emoji-small {
            position: absolute;
            top: 9px;
            left: 11px;
            font-size: 18px;
            line-height: 1;
        }

        .card-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(245, 228, 204, 0.6);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--light); }
        .empty-sub { font-size: 15px; line-height: 1.5; }

        /* ---------- FULLSCREEN OVERLAY ---------- */
        .fullscreen-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 28px;
            cursor: pointer;
        }

        .fullscreen-overlay.visible {
            display: flex;
            animation: overlayIn 0.2s ease;
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .overlay-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(245, 228, 204, 0.12);
            color: var(--light);
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            z-index: 1;
        }

        .overlay-close:active {
            background: rgba(245, 228, 204, 0.25);
        }

        .overlay-icon-small {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 32px;
            line-height: 1;
        }

        .overlay-text {
            font-size: var(--overlay-font-size, 64px);
            font-weight: 700;
            color: var(--light);
            text-align: center;
            line-height: 1.15;
            margin-bottom: 28px;
        }

        .overlay-subtext {
            font-size: 26px;
            color: rgba(245, 228, 204, 0.8);
            text-align: center;
            line-height: 1.6;
        }

        /* ---------- MODAL ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }

        .modal-backdrop.visible { display: flex; }

        .modal-sheet {
            width: 100%;
            background-color: var(--light);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 32px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .modal-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
            display: block;
        }

        .modal-label-sub {
            font-size: 13px;
            color: rgba(46, 58, 89, 0.6);
            margin-bottom: 8px;
            font-weight: normal;
        }

        .modal-input {
            width: 100%;
            background-color: rgba(46, 58, 89, 0.06);
            border: 2px solid rgba(46, 58, 89, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-textarea {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-cancel {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(46, 58, 89, 0.2);
            background: transparent;
            color: var(--dark);
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-save {
            flex: 2;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent);
            color: var(--dark);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-save:active { opacity: 0.85; }

        /* ---------- EMOJI PICKER ---------- */
        .emoji-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .emoji-preview {
            font-size: 40px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(46, 58, 89, 0.06);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .emoji-input-wrap { flex: 1; }

        .emoji-input {
            width: 100%;
            background-color: rgba(46, 58, 89, 0.06);
            border: 2px solid rgba(46, 58, 89, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 24px;
            color: var(--dark);
            box-sizing: border-box;
            text-align: center;
        }

        .emoji-input:focus {
            outline: none;
            border-color: var(--accent);
        }


        /* ---------- LANDSCAPE ---------- */
        @media (orientation: landscape) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .com-card {
                min-height: 70px;
            }
            .fullscreen-overlay {
                padding: 16px 28px;
                overflow-y: auto;
            }
            .overlay-text {
                font-size: min(var(--overlay-font-size, 64px), 9vh);
                margin-bottom: 14px;
            }
            .overlay-subtext {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" id="btnRetour" aria-label="Retour">⬅️</button>
        <h1 class="page-title" style="flex:1">Cartes de communication</h1>
        <button class="back-button" id="btnAccueil" style="margin-left:auto;" aria-label="Accueil">🏠</button>
    </header>

    <main class="main-content">
        <p class="intro-text">Appuie sur une carte pour l'afficher en grand. Tu pourras la montrer à ton interlocuteur.</p>

        <!-- Toggle icônes -->
        <div class="icons-toggle-row">
            <div class="icons-toggle-label">Afficher les icônes</div>
            <div class="toggle-switch" id="iconsToggle">
                <div class="toggle-knob"></div>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </main>

    <footer class="footer">
        <button class="footer-button center" id="btnAddCard">+ Ajouter une carte</button>
    </footer>

    <!-- Modal ajout carte -->
    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Nouvelle carte">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-title">Nouvelle carte</div>

            <label class="modal-label">Emoji
                <span class="modal-label-sub">Un seul emoji pour représenter la carte</span>
            </label>
            <div class="emoji-picker-row">
                <div class="emoji-preview" id="emojiPreview">💬</div>
                <div class="emoji-input-wrap">
                    <input type="text" class="emoji-input" id="emojiInput" maxlength="4" placeholder="💬">
                </div>
            </div>

            <label class="modal-label" for="textInput">Texte principal</label>
            <input type="text" class="modal-input" id="textInput" placeholder="Ex : Ne me touchez pas" maxlength="60">

            <label class="modal-label" for="sousTexteInput">Sous-texte <span style="font-weight:400; opacity:0.7">(optionnel)</span></label>
            <textarea class="modal-input modal-textarea" id="sousTexteInput" placeholder="Ex : Ne me touchez pas, même pour aider. Merci." maxlength="200"></textarea>

            <div class="modal-actions">
                <button class="btn-cancel" id="btnModalCancel">Annuler</button>
                <button class="btn-save" id="btnModalSave">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay" role="dialog" aria-modal="true" aria-label="Carte de communication">
        <button class="overlay-close" id="btnCloseOverlay" aria-label="Fermer">×</button>
        <div class="overlay-icon-small" id="overlayIcon"></div>
        <div class="overlay-text" id="overlayText"></div>
        <div class="overlay-subtext" id="overlaySubtext"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        const DEFAULT_CARDS = [
            { id: '1', emoji: '🚫', text: 'Ne me touchez pas', sousTexte: 'Ne me touchez pas, même pour aider. Merci.' },
            { id: '2', emoji: '🤫', text: 'Je ne peux pas parler', sousTexte: 'Je suis temporairement mutique. Je vous entends mais je ne peux pas répondre verbalement. C\'est involontaire' },
            { id: '3', emoji: '🔕', text: 'Besoin de silence', sousTexte: "J'ai besoin de calme et de silence complet. Merci de ne pas me parler svp." },
            { id: '4', emoji: '🚪', text: "Besoin de m'isoler", sousTexte: "Je suis en surcharge sensorielle. J'ai besoin de m'isoler dans un endroit calme." },
            { id: '5', emoji: '🆘', text: "J'ai besoin d'aide", sousTexte: "Je fais une crise autistique. Aidez-moi svp à trouver un endroit calme et sombre." },
            { id: '6', emoji: '🪪', text: 'Passage prioritaire CMI', sousTexte: "Je bénéficie d'une CMI mention priorité. Pourriez-vous me laisser passer en priorité svp ?" },
            { id: '7', emoji: '🙏', text: 'Ouvrir une caisse', sousTexte: "Pourriez-vous ouvrir une caisse prioritaire svp ? Je suis en situation de handicap." },
            { id: '8', emoji: '✋', text: 'Laissez-moi', sousTexte: "J'ai besoin de temps. Je reviendrai vers vous quand je serai prête." },
            { id: '9', emoji: '🧠', text: 'Je suis en surcharge', sousTexte: "Merci de me laisser tranquille et de m'aider à réduire au maximum les stimulations sensorielles." }
        ];

        /* ---------- STORAGE ---------- */
        function getCards() {
            const stored = localStorage.getItem('cartesCommunication');
            if (!stored) {
                localStorage.setItem('cartesCommunication', JSON.stringify(DEFAULT_CARDS));
                return DEFAULT_CARDS;
            }
            return JSON.parse(stored);
        }

        function saveCards(cards) {
            localStorage.setItem('cartesCommunication', JSON.stringify(cards));
        }

        /* ---------- ICONS TOGGLE ---------- */
        function showIcons() {
            return localStorage.getItem('cartesShowIcons') !== 'false';
        }

        function toggleIcons() {
            const isActive = !showIcons();
            localStorage.setItem('cartesShowIcons', isActive ? 'true' : 'false');
            document.getElementById('iconsToggle').classList.toggle('active', isActive);
            renderCards();
            showToast(isActive ? 'Icônes affichées sur les cartes' : 'Icônes masquées sur les cartes');
        }

        function initToggle() {
            document.getElementById('iconsToggle').classList.toggle('active', showIcons());
        }

        /* ---------- DYNAMIC FONT SIZE ---------- */
        function getCardFontSize(len) {
            if (len <= 15) return 15;
            if (len <= 22) return 14;
            if (len <= 30) return 13;
            if (len <= 40) return 12;
            return 11;
        }

        function adjustCardFonts() {
            document.querySelectorAll('.card-text').forEach(el => {
                el.style.fontSize = getCardFontSize(el.textContent.trim().length) + 'px';
            });
        }

        function getOverlayFontSize(text) {
            const len = text.length;
            if (len <= 10) return 64;
            if (len <= 16) return 52;
            if (len <= 22) return 44;
            if (len <= 30) return 36;
            if (len <= 42) return 28;
            return 22;
        }

        /* ---------- FORMAT ---------- */
        function formatSubtext(text) {
            if (!text) return '';
            const safe = escapeHtml(text);
            return safe.replace(/\. /g, '.<br>').replace(/\? /g, '?<br>');
        }

        /* ---------- RENDER ---------- */
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const cards = getCards();
            const iconsOn = showIcons();

            if (cards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <div class="empty-icon">💬</div>
                        <div class="empty-title">Aucune carte</div>
                        <div class="empty-sub">Ajoute une carte avec le bouton ci-dessous.</div>
                    </div>`;
                return;
            }

            grid.innerHTML = cards.map(card => `
                <div class="com-card" data-card-id="${card.id}" role="button" aria-label="${escapeHtml(card.text)}">
                    ${iconsOn ? `<div class="card-emoji-small">${card.emoji}</div>` : ''}
                    <div class="card-text">${escapeHtml(card.text)}</div>
                </div>
            `).join('');

            adjustCardFonts();
        }

        function trapFocus(modal) {
            if (modal._trapHandler) {
                modal.removeEventListener('keydown', modal._trapHandler);
                delete modal._trapHandler;
            }
            const sel = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
            const focusables = [...modal.querySelectorAll(sel)];
            if (!focusables.length) return;
            focusables[0].focus();
            function handler(e) {
                if (e.key !== 'Tab') return;
                const idx = focusables.indexOf(document.activeElement);
                if (e.shiftKey) {
                    if (idx <= 0) { e.preventDefault(); focusables[focusables.length - 1].focus(); }
                } else {
                    if (idx === focusables.length - 1) { e.preventDefault(); focusables[0].focus(); }
                }
            }
            modal._trapHandler = handler;
            modal.addEventListener('keydown', handler);
        }
        function releaseTrap(modal) {
            if (modal._trapHandler) {
                modal.removeEventListener('keydown', modal._trapHandler);
                delete modal._trapHandler;
            }
        }

        /* ---------- OPEN CARD ---------- */
        function openCard(id) {
            const cards = getCards();
            const card = cards.find(c => c.id === id);
            if (!card) return;

            const iconsOn = showIcons();
            const iconEl = document.getElementById('overlayIcon');
            iconEl.textContent = iconsOn ? card.emoji : '';
            iconEl.style.display = iconsOn ? 'block' : 'none';

            const overlayTextEl = document.getElementById('overlayText');
            overlayTextEl.textContent = card.text;
            overlayTextEl.style.setProperty('--overlay-font-size', getOverlayFontSize(card.text) + 'px');

            const subEl = document.getElementById('overlaySubtext');
            if (card.sousTexte) {
                subEl.innerHTML = formatSubtext(card.sousTexte);
                subEl.style.display = 'block';
            } else {
                subEl.style.display = 'none';
            }

            const ov = document.getElementById('fullscreenOverlay');
            ov.classList.add('visible');
            trapFocus(ov);
        }

        function closeOverlay() {
            const ov = document.getElementById('fullscreenOverlay');
            releaseTrap(ov);
            ov.classList.remove('visible');
        }

        /* ---------- MODAL ---------- */
        function openModal() {
            document.getElementById('emojiInput').value = '';
            document.getElementById('emojiPreview').textContent = '💬';
            document.getElementById('textInput').value = '';
            document.getElementById('sousTexteInput').value = '';
            const m = document.getElementById('modalBackdrop');
            m.classList.add('visible');
            trapFocus(m);
        }

        function closeModal() {
            const m = document.getElementById('modalBackdrop');
            releaseTrap(m);
            m.classList.remove('visible');
        }

        function handleBackdropClick(e) {
            if (e.target === document.getElementById('modalBackdrop')) closeModal();
        }

        function updateEmojiPreview() {
            const val = document.getElementById('emojiInput').value.trim();
            document.getElementById('emojiPreview').textContent = val || '💬';
        }

        function saveCard() {
            const emoji = document.getElementById('emojiInput').value.trim() || '💬';
            const text = document.getElementById('textInput').value.trim();
            const sousTexte = document.getElementById('sousTexteInput').value.trim();

            if (!text) { document.getElementById('textInput').focus(); return; }

            const cards = getCards();
            cards.push({ id: Date.now().toString(), emoji, text, sousTexte });
            saveCards(cards);
            closeModal();
            renderCards();
            showToast('Carte ajoutée');
        }

        /* ---------- TOAST ---------- */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeOverlay();
                closeModal();
            }
        });

        function goBack() { if (history.length > 1) { history.back(); } else { location.href = 'index.html'; } }

        document.getElementById('btnRetour').addEventListener('click', goBack);
        document.getElementById('btnAccueil').addEventListener('click', function() { window.location.href = 'index.html'; });
        document.getElementById('iconsToggle').addEventListener('click', toggleIcons);
        document.getElementById('btnAddCard').addEventListener('click', openModal);
        document.getElementById('modalBackdrop').addEventListener('click', handleBackdropClick);
        document.getElementById('modalSheet').addEventListener('click', function(e) { e.stopPropagation(); });
        document.getElementById('btnModalCancel').addEventListener('click', closeModal);
        document.getElementById('btnModalSave').addEventListener('click', saveCard);
        document.getElementById('fullscreenOverlay').addEventListener('click', closeOverlay);
        document.getElementById('btnCloseOverlay').addEventListener('click', function(e) { e.stopPropagation(); closeOverlay(); });
        document.getElementById('emojiInput').addEventListener('input', updateEmojiPreview);
        document.getElementById('cardsGrid').addEventListener('click', function(e) {
            var card = e.target.closest('.com-card');
            if (card) openCard(card.dataset.cardId);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initToggle();
            renderCards();
        });
    </script>
    <script src="nora-scroll.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
