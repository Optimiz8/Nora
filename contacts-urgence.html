<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Contacts d'urgence</title>
    <style>
        body {
            padding-bottom: 20px;
        }

        .main-content {
            padding: 24px 20px;
        }

        .intro-text {
            color: rgba(245, 228, 204, 0.8);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Bouton ajouter */
        .add-contact-btn {
            background-color: var(--accent);
            border: none;
            color: var(--dark);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 24px;
            transition: all 0.2s;
        }

        .add-contact-btn:active {
            transform: scale(0.98);
            background-color: rgba(247, 184, 156, 0.9);
        }

        .add-contact-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Liste des contacts */
        .contacts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-card {
            background-color: var(--light);
            border-radius: 12px;
            padding: 16px 18px;
            border: 2px solid transparent;
        }

        .contact-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .contact-number {
            font-size: 15px;
            font-weight: 600;
            color: rgba(46, 58, 89, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 10px;
            min-width: 44px;
            min-height: 44px;
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .contact-info {
            color: var(--dark);
        }

        .contact-main {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .contact-phone {
            font-size: 15px;
            opacity: 0.8;
        }

        .contact-remarque {
            font-size: 15px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .contact-remarque .remark-text {
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            color: rgba(245, 228, 204, 0.6);
            padding: 40px 20px;
            font-size: 15px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.visible {
            display: flex;
        }

        .modal-content {
            background-color: var(--light);
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 400px;
            width: 100%;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            background-color: rgba(46, 58, 89, 0.05);
            border: 2px solid rgba(46, 58, 89, 0.2);
            border-radius: 10px;
            padding: 12px;
            font-family: inherit;
            font-size: 15px;
            color: var(--dark);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(247, 184, 156, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .modal-button.secondary {
            background-color: rgba(46, 58, 89, 0.1);
            color: var(--dark);
        }

        .modal-button.primary {
            background-color: var(--accent);
            color: var(--dark);
        }

        .modal-button:active {
            transform: scale(0.96);
        }

        /* Bouton import contacts */
        .import-contact-btn {
            width: 100%;
            padding: 12px;
            background: rgba(247, 184, 156, 0.15);
            border: 2px dashed var(--accent);
            border-radius: 10px;
            color: var(--dark);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .import-contact-btn:active {
            transform: scale(0.98);
            background: rgba(247, 184, 156, 0.25);
        }

    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" id="btnRetour" aria-label="Retour">⬅️</button>
        <h1 class="page-title" style="flex:1">Contacts d'urgence</h1>
        <button class="back-button" id="btnAccueil" style="margin-left:auto;" aria-label="Accueil">🏠</button>
    </header>

    <main class="main-content">
        <p class="intro-text">
            Ces contacts pourront être sélectionnés selon le contexte (Maison, Extérieur, Travail, Secours). Tu peux en ajouter jusqu'à 10.
        </p>

        <button class="add-contact-btn" id="btnAddContact">
            Ajouter un contact
        </button>

        <div class="contacts-list" id="contactsList">
            <!-- Généré dynamiquement -->
        </div>

    </main>

    <!-- Modal Ajout/Modification -->
    <div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-label="Contact d'urgence">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Ajouter un contact</h2>
            </div>

            <div class="input-group">
                <label class="input-label">Nom/Prénom *</label>
                <input
                    type="text"
                    class="input-field"
                    id="inputNom"
                    placeholder="Ex : Maman, Dr Dupont, Marie..."
                    required
                >
            </div>

            <!-- Bouton import contacts -->
            <button
                class="import-contact-btn"
                id="importContactBtn"
                type="button"
                style="display: none;"
            >
                📱 Importer depuis les contacts
            </button>

            <div class="input-group">
                <label class="input-label">Téléphone *</label>
                <input
                    type="tel"
                    class="input-field"
                    id="inputTelephone"
                    placeholder="Ex : 06 12 34 56 78"
                    required
                >
            </div>

            <div class="input-group">
                <label class="input-label">Lien (optionnel)</label>
                <input
                    type="text"
                    class="input-field"
                    id="inputLien"
                    placeholder="Ex : Sœur, Ami(e), Médecin..."
                >
            </div>

            <div class="input-group">
                <label class="input-label">Remarque (optionnel)</label>
                <input
                    type="text"
                    class="input-field"
                    id="inputRemarque"
                    placeholder="Ex : Travail de nuit, contact prioritaire..."
                >
            </div>

            <div class="modal-actions">
                <button class="modal-button secondary" id="btnModalCancel">Annuler</button>
                <button class="modal-button primary" id="btnModalSave">Enregistrer</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function escapeHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function showToast(msg, duration) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(function() { t.classList.remove('visible'); }, duration || 3000);
        }

        let contacts = [];
        let editingIndex = null;
        const MAX_CONTACTS = 10;

        window.addEventListener('DOMContentLoaded', () => {
            loadContacts();
            renderContacts();
            updateAddButton();
            checkContactPickerSupport();
        });

        // Vérifier si l'API Contact Picker est disponible
        function checkContactPickerSupport() {

            if ('contacts' in navigator && 'ContactsManager' in window) {
                document.getElementById('importContactBtn').style.display = 'block';
            } else {
                // Afficher un message d'info temporaire pour debug
            }
        }

        // Importer un contact depuis le téléphone
        async function importFromContacts() {
            if (!('contacts' in navigator)) {
                showToast('Cette fonctionnalité n\'est pas disponible sur votre navigateur');
                return;
            }

            try {
                const props = ['name', 'tel'];
                const opts = { multiple: false };

                const contacts = await navigator.contacts.select(props, opts);

                if (contacts.length > 0) {
                    const contact = contacts[0];

                    // Remplir le champ nom
                    if (contact.name && contact.name.length > 0) {
                        document.getElementById('inputNom').value = contact.name[0];
                    }

                    // Remplir le champ téléphone
                    if (contact.tel && contact.tel.length > 0) {
                        // Nettoyer le numéro (enlever les espaces et tirets inutiles)
                        const phone = contact.tel[0].replace(/[-\s]/g, '');
                        document.getElementById('inputTelephone').value = phone;
                    }
                }
            } catch (error) {
                // L'utilisateur a annulé ou une erreur s'est produite
                if (error.name !== 'AbortError') {
                    console.error('Erreur lors de l\'import du contact:', error);
                    showToast('Impossible d\'importer le contact');
                }
            }
        }

        function loadContacts() {
            const saved = localStorage.getItem('contactsUrgence');
            contacts = saved ? JSON.parse(saved) : [];

            // Migration : ajouter un ID aux contacts qui n'en ont pas
            let needsSave = false;
            contacts.forEach(contact => {
                if (!contact.id) {
                    contact.id = 'contact_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    needsSave = true;
                }
            });

            if (needsSave) {
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('contactsUrgence', JSON.stringify(contacts));
        }

        function updateAddButton() {
            const btn = document.querySelector('.add-contact-btn');
            if (contacts.length >= MAX_CONTACTS) {
                btn.disabled = true;
                btn.textContent = `Limite de ${MAX_CONTACTS} contacts atteinte`;
            } else {
                btn.disabled = false;
                btn.textContent = 'Ajouter un contact';
            }
        }

        function renderContacts() {
            const container = document.getElementById('contactsList');
            container.innerHTML = '';

            if (contacts.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun contact ajouté. Cliquez sur "Ajouter un contact" pour commencer.</div>';
                return;
            }

            contacts.forEach((contact, index) => {
                const card = document.createElement('div');
                card.className = 'contact-card';

                // Format : Nom (Lien) - Téléphone
                const nomComplet = escapeHtml(contact.nom || 'Contact');
                const lien = contact.lien ? ` (${escapeHtml(contact.lien)})` : '';
                const telephone = contact.telephone ? escapeHtml(contact.telephone) : '';

                let remarque = '';
                if (contact.remarque) {
                    let fmtR;
                    const safeRemarque = escapeHtml(contact.remarque);
                    try {
                        var eRx = new RegExp('(\\p{Emoji_Presentation}|\\p{Extended_Pictographic})', 'gu');
                        fmtR = '<span class="remark-text">' + safeRemarque.replace(eRx, '</span>$1<span class="remark-text">') + '</span>';
                    } catch(e) {
                        fmtR = '<span class="remark-text">' + safeRemarque + '</span>';
                    }
                    remarque = '<div class="contact-remarque">' + fmtR + '</div>';
                }

                card.innerHTML = `
                    <div class="contact-header">
                        <div class="contact-number">Contact ${index + 1}</div>
                        <div class="contact-actions">
                            <button class="action-btn btn-edit-contact" data-index="${index}" title="Modifier">✏️</button>
                            <button class="action-btn btn-delete-contact" data-index="${index}" title="Supprimer">🗑️</button>
                        </div>
                    </div>
                    <div class="contact-info">
                        <div class="contact-main">${nomComplet}${lien}</div>
                        <div class="contact-phone">${telephone}</div>
                        ${remarque}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function openAddModal() {
            if (contacts.length >= MAX_CONTACTS) {
                return;
            }
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Ajouter un contact';
            document.getElementById('inputNom').value = '';
            document.getElementById('inputLien').value = '';
            document.getElementById('inputTelephone').value = '';
            document.getElementById('inputRemarque').value = '';
            const m = document.getElementById('contactModal');
            m.classList.add('visible');
            trapFocus(m);
        }

        function editContact(index) {
            editingIndex = index;
            const contact = contacts[index];
            document.getElementById('modalTitle').textContent = 'Modifier le contact';
            document.getElementById('inputNom').value = contact.nom || '';
            document.getElementById('inputLien').value = contact.lien || '';
            document.getElementById('inputTelephone').value = contact.telephone || '';
            document.getElementById('inputRemarque').value = contact.remarque || '';
            const m = document.getElementById('contactModal');
            m.classList.add('visible');
            trapFocus(m);
        }

        function deleteContact(index) {
            if (confirm('Supprimer ce contact ?')) {
                contacts.splice(index, 1);
                saveToStorage();
                renderContacts();
                updateAddButton();
            }
        }

        function saveContact() {
            const nom = document.getElementById('inputNom').value.trim();
            const lien = document.getElementById('inputLien').value.trim();
            const telephone = document.getElementById('inputTelephone').value.trim();
            const remarque = document.getElementById('inputRemarque').value.trim();

            // Validation : Nom/Prénom ET Téléphone obligatoires
            if (!nom) {
                showToast('Veuillez renseigner un nom ou un prénom');
                return;
            }

            if (!telephone) {
                showToast('Veuillez renseigner un numéro de téléphone');
                return;
            }

            // Validation du format du numéro de téléphone
            // On extrait uniquement les chiffres pour vérifier
            const digitsOnly = telephone.replace(/\D/g, '');


            // Vérifier si c'est un numéro international (commence par + ou 00 dans l'original)
            const isInternational = telephone.trim().startsWith('+') || telephone.trim().startsWith('00');

            // Pour un numéro français normal : exactement 10 chiffres
            if (!isInternational && digitsOnly.length !== 10) {
                if (digitsOnly.length < 10) {
                    showToast('Le numéro de téléphone est incomplet. Un numéro français doit contenir exactement 10 chiffres. Tu as saisi ' + digitsOnly.length + ' chiffres.');
                } else {
                    showToast('Le numéro de téléphone est trop long. Un numéro français doit contenir exactement 10 chiffres. Tu as saisi ' + digitsOnly.length + ' chiffres.');
                }
                return;
            }

            // Pour un numéro international : au moins 10 chiffres (après 00 ou +33)
            if (isInternational && digitsOnly.length < 10) {
                showToast('Le numéro de téléphone international est incomplet. Tu as saisi ' + digitsOnly.length + ' chiffres.');
                return;
            }


            const contact = {
                id: '', // Sera défini ci-dessous
                nom,
                lien,
                telephone,
                remarque
            };

            if (editingIndex !== null) {
                // Modification : garder l'ID existant
                contact.id = contacts[editingIndex].id;
                contacts[editingIndex] = contact;
            } else {
                // Ajout : générer un nouvel ID unique
                contact.id = 'contact_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                contacts.push(contact);
            }

            saveToStorage();
            renderContacts();
            updateAddButton();
            closeModal();
        }

        function trapFocus(modal) {
            const sel = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
            const focusables = [...modal.querySelectorAll(sel)];
            if (!focusables.length) return;
            focusables[0].focus();
            function handler(e) {
                if (e.key !== 'Tab') return;
                const idx = focusables.indexOf(document.activeElement);
                if (e.shiftKey) {
                    if (idx <= 0) { e.preventDefault(); focusables[focusables.length - 1].focus(); }
                } else {
                    if (idx === focusables.length - 1) { e.preventDefault(); focusables[0].focus(); }
                }
            }
            modal._trapHandler = handler;
            modal.addEventListener('keydown', handler);
        }
        function releaseTrap(modal) {
            if (modal._trapHandler) {
                modal.removeEventListener('keydown', modal._trapHandler);
                delete modal._trapHandler;
            }
        }

        function closeModal() {
            const m = document.getElementById('contactModal');
            releaseTrap(m);
            m.classList.remove('visible');
        }

        function goBack() {
            const returnTo = localStorage.getItem('returnTo');
            if (returnTo === 'carte-config') {
                localStorage.removeItem('returnTo');
                window.location.href = 'carte-config.html';
            } else {
                localStorage.removeItem('returnTo');
                window.location.href = 'parametres.html';
            }
        }

        document.getElementById('btnRetour').addEventListener('click', goBack);
        document.getElementById('btnAccueil').addEventListener('click', function() { window.location.href = 'index.html'; });
        document.getElementById('btnAddContact').addEventListener('click', openAddModal);
        document.getElementById('importContactBtn').addEventListener('click', importFromContacts);
        document.getElementById('btnModalCancel').addEventListener('click', closeModal);
        document.getElementById('btnModalSave').addEventListener('click', saveContact);
        document.getElementById('contactsList').addEventListener('click', function(e) {
            var editBtn = e.target.closest('.btn-edit-contact');
            var deleteBtn = e.target.closest('.btn-delete-contact');
            if (editBtn) editContact(Number(editBtn.dataset.index));
            if (deleteBtn) deleteContact(Number(deleteBtn.dataset.index));
        });
    </script>
    <script>        document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });</script>
    <script src="nora-scroll.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
