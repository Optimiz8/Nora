<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#384657">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/images/favicone.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="nora-common.css">
    <title>Cartes de communication</title>
    <style>
        .main-content {
            padding: 20px 16px 40px;
        }

        .section-intro {
            font-size: 15px;
            color: rgba(245, 228, 204, 0.75);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* ---------- TOGGLE ICONS SETTING ---------- */
        .setting-row {
            background: rgba(245, 228, 204, 0.07);
            border: 1.5px solid rgba(245, 228, 204, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .setting-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--light);
        }

        .setting-sub {
            font-size: 12px;
            color: rgba(245, 228, 204, 0.5);
            margin-top: 2px;
        }

        .toggle-switch {
            width: 48px;
            height: 28px;
            background: rgba(46, 58, 89, 0.4);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-knob {
            transform: translateX(20px);
        }

        /* ---------- CARDS LIST ---------- */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card-row {
            background-color: var(--light);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-row-emoji {
            font-size: 24px;
            flex-shrink: 0;
            width: 36px;
            text-align: center;
        }

        .card-row-texts {
            flex: 1;
            min-width: 0;
        }

        .card-row-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-row-sub {
            font-size: 12px;
            color: rgba(46, 58, 89, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .card-row-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-move {
            background-color: rgba(46, 58, 89, 0.08);
            color: var(--dark);
            font-size: 13px;
        }

        .btn-move:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .btn-edit {
            background-color: rgba(46, 58, 89, 0.1);
            color: var(--dark);
        }

        .btn-delete {
            background-color: rgba(220, 80, 80, 0.1);
            color: #dc5050;
        }

        .btn-delete:active { background-color: rgba(220, 80, 80, 0.2); }
        .btn-edit:active   { background-color: rgba(46, 58, 89, 0.2); }
        .btn-move:active:not(:disabled) { background-color: rgba(46, 58, 89, 0.18); }

        /* ---------- ADD BUTTON ---------- */
        .add-card-btn {
            width: 100%;
            padding: 16px;
            border: 2px dashed rgba(245, 228, 204, 0.4);
            border-radius: 12px;
            background: transparent;
            color: rgba(245, 228, 204, 0.75);
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 12px;
        }

        .add-card-btn:active { background-color: rgba(245, 228, 204, 0.05); }

        /* ---------- RESET BUTTON ---------- */
        .reset-btn {
            width: 100%;
            padding: 14px;
            border: 1.5px solid rgba(220, 80, 80, 0.3);
            border-radius: 12px;
            background: transparent;
            color: rgba(220, 80, 80, 0.8);
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            margin-top: 8px;
        }

        .reset-btn:active { background-color: rgba(220, 80, 80, 0.06); }

        /* ---------- MODAL ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            align-items: flex-end;
        }

        .modal-backdrop.visible { display: flex; }

        .modal-sheet {
            width: 100%;
            background-color: var(--light);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 32px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .modal-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
            display: block;
        }

        .modal-label-sub {
            font-size: 13px;
            color: rgba(46, 58, 89, 0.6);
            margin-bottom: 8px;
            font-weight: normal;
        }

        .modal-input {
            width: 100%;
            background-color: rgba(46, 58, 89, 0.06);
            border: 2px solid rgba(46, 58, 89, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-textarea {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-cancel {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(46, 58, 89, 0.2);
            background: transparent;
            color: var(--dark);
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-save {
            flex: 2;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent);
            color: var(--dark);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-save:active { opacity: 0.85; }

        /* ---------- EMOJI PICKER ---------- */
        .emoji-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .emoji-preview {
            font-size: 40px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(46, 58, 89, 0.06);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .emoji-input-wrap { flex: 1; }

        .emoji-input {
            width: 100%;
            background-color: rgba(46, 58, 89, 0.06);
            border: 2px solid rgba(46, 58, 89, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 24px;
            color: var(--dark);
            box-sizing: border-box;
            text-align: center;
        }

        .emoji-input:focus {
            outline: none;
            border-color: var(--accent);
        }


        /* ---------- CARD PREVIEW ---------- */
        .card-preview-wrap {
            margin-bottom: 16px;
        }

        .card-preview-label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(46, 58, 89, 0.45);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-preview {
            border: 1.5px solid rgba(46, 58, 89, 0.15);
            border-radius: 12px;
            padding: 14px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-preview-emoji-sm {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 15px;
            line-height: 1;
        }

        .card-preview-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            word-break: break-word;
            width: 100%;
        }

        .card-preview-text.placeholder {
            opacity: 0.35;
            font-weight: 400;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(245, 228, 204, 0.6);
        }

        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-text { font-size: 15px; }

        /* ---------- MODALE CONFIRM ---------- */
        #confirmModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
        #confirmModal.visible { display: flex; }
        #confirmModal .confirm-box { background: var(--bg); border-radius: 16px; padding: 24px; max-width: 320px; width: 100%; }
        #confirmModal .confirm-msg { color: var(--light); font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        #confirmModal .confirm-actions { display: flex; gap: 12px; }
        #confirmModal .confirm-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        #confirmModal .btn-confirm-cancel { background: rgba(245,228,204,0.15); color: var(--light); }
        #confirmModal .btn-confirm-ok { background: var(--accent); color: var(--dark); }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" id="btnRetour" aria-label="Retour">⬅️</button>
        <h1 class="page-title" style="flex:1">Cartes de communication</h1>
        <button class="back-button" id="btnAccueil" style="margin-left:auto;" aria-label="Accueil">🏠</button>
    </header>

    <main class="main-content">
        <p class="section-intro">Ces cartes s'affichent en plein écran quand tu appuies dessus. Tu peux les montrer à ton interlocuteur quand la parole est difficile.</p>

        <!-- Toggle icônes -->
        <div class="setting-row">
            <div>
                <div class="setting-label">Afficher les icônes</div>
                <div class="setting-sub">Petite icône en haut à gauche de chaque carte</div>
            </div>
            <div class="toggle-switch" id="iconsToggle">
                <div class="toggle-knob"></div>
            </div>
        </div>

        <div class="cards-list" id="cardsList"></div>
        <button class="add-card-btn" id="btnAddCard">+ Ajouter une carte</button>
        <button class="reset-btn" id="btnReset">Réinitialiser les cartes par défaut</button>
    </main>

    <!-- Modal ajout / modification -->
    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Carte de communication">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-title" id="modalTitle">Nouvelle carte</div>

            <label class="modal-label">Emoji
                <span class="modal-label-sub">Un seul emoji pour représenter la carte</span>
            </label>
            <div class="emoji-picker-row">
                <div class="emoji-preview" id="emojiPreview">💬</div>
                <div class="emoji-input-wrap">
                    <input type="text" class="emoji-input" id="emojiInput" maxlength="4" placeholder="💬">
                </div>
            </div>

            <label class="modal-label" for="textInput">Texte principal</label>
            <input type="text" class="modal-input" id="textInput" placeholder="Ex : Ne me touchez pas" maxlength="60">

            <div class="card-preview-wrap">
                <div class="card-preview-label">Aperçu de la carte</div>
                <div class="card-preview">
                    <div class="card-preview-emoji-sm" id="cardPreviewEmoji" style="display:none"></div>
                    <div class="card-preview-text placeholder" id="cardPreviewText">Ton texte apparaîtra ici</div>
                </div>
            </div>

            <label class="modal-label" for="sousTexteInput">Sous-texte <span style="font-weight:400; opacity:0.7">(optionnel)</span></label>
            <textarea class="modal-input modal-textarea" id="sousTexteInput" placeholder="Ex : Ne me touchez pas, même pour aider. Merci." maxlength="200"></textarea>

            <div class="modal-actions">
                <button class="btn-cancel" id="btnModalCancel">Annuler</button>
                <button class="btn-save" id="btnModalSave">Enregistrer</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div id="confirmModal" role="dialog" aria-modal="true">
        <div class="confirm-box">
            <p class="confirm-msg" id="confirmMsg"></p>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" id="confirmCancel">Annuler</button>
                <button class="btn-confirm-ok" id="confirmOk">Confirmer</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_CARDS = [
            { id: '1', emoji: '🚫', text: 'Ne me touchez pas svp', sousTexte: 'Ne me touchez pas, même pour aider. Merci.' },
            { id: '2', emoji: '🤫', text: 'Je ne peux pas parler', sousTexte: 'Je suis temporairement mutique. Je vous entends mais je ne peux pas répondre verbalement. C\'est involontaire et ça peut être transitoire.' },
            { id: '3', emoji: '🔕', text: 'Besoin de silence', sousTexte: "J'ai besoin de calme et de silence complet. Merci de ne pas me parler svp." },
            { id: '4', emoji: '🚪', text: "Besoin de m'isoler", sousTexte: "Je suis en surcharge sensorielle. J'ai besoin de m'isoler dans un endroit calme svp." },
            { id: '5', emoji: '🆘', text: "J'ai besoin d'aide", sousTexte: "Je fais une crise autistique. Aidez-moi svp à trouver un endroit calme et sombre." },
            { id: '6', emoji: '🪪', text: 'Passage prioritaire CMI', sousTexte: "Je bénéficie d'une CMI mention priorité. Pourriez-vous me laisser passer en priorité svp ?" },
            { id: '7', emoji: '🙏', text: 'Ouvrir une caisse', sousTexte: "Pourriez-vous ouvrir une caisse prioritaire svp ? Je suis en situation de handicap." },
            { id: '8', emoji: '✋', text: 'Laissez-moi svp', sousTexte: "J'ai besoin de temps. Je reviendrai vers vous quand je serai prête." },
            { id: '9', emoji: '🧠', text: 'Je suis en surcharge', sousTexte: "Merci de me laisser tranquille et de m'aider à réduire au maximum les stimulations sensorielles." }
        ];

        let editingId = null;

        /* ---------- STORAGE ---------- */
        function getCards() {
            const stored = localStorage.getItem('cartesCommunication');
            if (!stored) {
                localStorage.setItem('cartesCommunication', JSON.stringify(DEFAULT_CARDS));
                return DEFAULT_CARDS;
            }
            return JSON.parse(stored);
        }

        function saveCards(cards) {
            localStorage.setItem('cartesCommunication', JSON.stringify(cards));
        }

        /* ---------- ICONS TOGGLE ---------- */
        function showIcons() {
            return localStorage.getItem('cartesShowIcons') !== 'false';
        }

        function toggleIcons() {
            const isActive = !showIcons();
            localStorage.setItem('cartesShowIcons', isActive ? 'true' : 'false');
            document.getElementById('iconsToggle').classList.toggle('active', isActive);
            renderCards();
            showToast(isActive ? 'Icônes affichées sur les cartes' : 'Icônes masquées sur les cartes');
        }

        function initToggle() {
            document.getElementById('iconsToggle').classList.toggle('active', showIcons());
        }

        /* ---------- RENDER ---------- */
        function renderCards() {
            const list = document.getElementById('cardsList');
            const cards = getCards();

            if (cards.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div class="empty-text">Aucune carte pour l'instant.<br>Appuie sur le bouton ci-dessous pour en ajouter.</div>
                    </div>`;
                return;
            }

            const iconsOn = showIcons();
            list.innerHTML = cards.map((card, index) => `
                <div class="card-row">
                    ${iconsOn ? `<div class="card-row-emoji">${card.emoji}</div>` : ''}
                    <div class="card-row-texts">
                        <div class="card-row-title">${card.text}</div>
                        ${card.sousTexte ? `<div class="card-row-sub">${card.sousTexte}</div>` : ''}
                    </div>
                    <div class="card-row-actions">
                        <button class="btn-icon btn-move btn-move-up" data-card-id="${card.id}" aria-label="Monter" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="btn-icon btn-move btn-move-down" data-card-id="${card.id}" aria-label="Descendre" ${index === cards.length - 1 ? 'disabled' : ''}>▼</button>
                        <button class="btn-icon btn-edit btn-edit-card" data-card-id="${card.id}" aria-label="Modifier">✏️</button>
                        <button class="btn-icon btn-delete btn-delete-card" data-card-id="${card.id}" aria-label="Supprimer">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        /* ---------- REORDER ---------- */
        function moveCard(id, direction) {
            const cards = getCards();
            const idx = cards.findIndex(c => c.id === id);
            if (direction === 'up' && idx > 0) {
                [cards[idx], cards[idx - 1]] = [cards[idx - 1], cards[idx]];
            } else if (direction === 'down' && idx < cards.length - 1) {
                [cards[idx], cards[idx + 1]] = [cards[idx + 1], cards[idx]];
            }
            saveCards(cards);
            renderCards();
        }

        function trapFocus(modal) {
            if (modal._trapHandler) {
                modal.removeEventListener('keydown', modal._trapHandler);
                delete modal._trapHandler;
            }
            const sel = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
            const focusables = [...modal.querySelectorAll(sel)];
            if (!focusables.length) return;
            focusables[0].focus();
            function handler(e) {
                if (e.key !== 'Tab') return;
                const idx = focusables.indexOf(document.activeElement);
                if (e.shiftKey) {
                    if (idx <= 0) { e.preventDefault(); focusables[focusables.length - 1].focus(); }
                } else {
                    if (idx === focusables.length - 1) { e.preventDefault(); focusables[0].focus(); }
                }
            }
            modal._trapHandler = handler;
            modal.addEventListener('keydown', handler);
        }
        function releaseTrap(modal) {
            if (modal._trapHandler) {
                modal.removeEventListener('keydown', modal._trapHandler);
                delete modal._trapHandler;
            }
        }

        /* ---------- MODAL ---------- */
        function openModal(id) {
            editingId = id;
            const title = document.getElementById('modalTitle');

            if (id) {
                const card = getCards().find(c => c.id === id);
                if (!card) return;
                title.textContent = 'Modifier la carte';
                document.getElementById('emojiInput').value = card.emoji;
                document.getElementById('emojiPreview').textContent = card.emoji;
                document.getElementById('textInput').value = card.text;
                document.getElementById('sousTexteInput').value = card.sousTexte || '';
            } else {
                title.textContent = 'Nouvelle carte';
                document.getElementById('emojiInput').value = '';
                document.getElementById('emojiPreview').textContent = '💬';
                document.getElementById('textInput').value = '';
                document.getElementById('sousTexteInput').value = '';
            }

            updateCardPreview();
            const m = document.getElementById('modalBackdrop');
            m.classList.add('visible');
            trapFocus(m);
        }

        function closeModal() {
            const m = document.getElementById('modalBackdrop');
            releaseTrap(m);
            m.classList.remove('visible');
            editingId = null;
        }

        function handleBackdropClick(e) {
            if (e.target === document.getElementById('modalBackdrop')) closeModal();
        }

        function updateEmojiPreview() {
            const val = document.getElementById('emojiInput').value.trim();
            document.getElementById('emojiPreview').textContent = val || '💬';
            updateCardPreview();
        }

        /* ---------- CARD PREVIEW ---------- */
        function getCardFontSize(len) {
            if (len <= 15) return 15;
            if (len <= 22) return 14;
            if (len <= 30) return 13;
            if (len <= 40) return 12;
            return 11;
        }

        function updateCardPreview() {
            const text = document.getElementById('textInput').value;
            const emoji = document.getElementById('emojiInput').value.trim() || '💬';
            const previewText = document.getElementById('cardPreviewText');
            const previewEmoji = document.getElementById('cardPreviewEmoji');

            if (text) {
                previewText.textContent = text;
                previewText.classList.remove('placeholder');
                previewText.style.fontSize = getCardFontSize(text.length) + 'px';
            } else {
                previewText.textContent = 'Ton texte apparaîtra ici';
                previewText.classList.add('placeholder');
                previewText.style.fontSize = '15px';
            }

            previewEmoji.textContent = emoji;
            previewEmoji.style.display = showIcons() ? 'block' : 'none';
        }

        function saveCard() {
            const emoji = document.getElementById('emojiInput').value.trim() || '💬';
            const text = document.getElementById('textInput').value.trim();
            const sousTexte = document.getElementById('sousTexteInput').value.trim();

            if (!text) { document.getElementById('textInput').focus(); return; }

            const cards = getCards();
            if (editingId) {
                const idx = cards.findIndex(c => c.id === editingId);
                if (idx !== -1) cards[idx] = { ...cards[idx], emoji, text, sousTexte };
            } else {
                cards.push({ id: Date.now().toString(), emoji, text, sousTexte });
            }

            saveCards(cards);
            closeModal();
            renderCards();
            showToast(editingId ? 'Carte modifiée' : 'Carte ajoutée');
        }

        /* ---------- DELETE ---------- */
        function deleteCard(id) {
            showConfirm('Supprimer cette carte ?', function() {
                saveCards(getCards().filter(c => c.id !== id));
                renderCards();
                showToast('Carte supprimée');
            });
        }

        /* ---------- RESET ---------- */
        function confirmReset() {
            showConfirm('Remettre toutes les cartes par défaut ? Tes modifications seront perdues.', function() {
                localStorage.setItem('cartesCommunication', JSON.stringify(DEFAULT_CARDS));
                renderCards();
                showToast('Cartes réinitialisées');
            });
        }

        /* ---------- TOAST ---------- */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        function goBack() {
            var tutorielRetour = localStorage.getItem('tutorielRetour');
            if (tutorielRetour) { localStorage.removeItem('tutorielRetour'); window.location.href = 'tutoriel.html'; }
            else { window.location.href = 'parametres.html'; }
        }

        document.getElementById('btnRetour').addEventListener('click', goBack);
        document.getElementById('btnAccueil').addEventListener('click', function() { window.location.href = 'index.html'; });
        document.getElementById('iconsToggle').addEventListener('click', toggleIcons);
        document.getElementById('btnAddCard').addEventListener('click', function() { openModal(null); });
        document.getElementById('btnReset').addEventListener('click', confirmReset);
        document.getElementById('modalBackdrop').addEventListener('click', handleBackdropClick);
        document.getElementById('modalSheet').addEventListener('click', function(e) { e.stopPropagation(); });
        document.getElementById('emojiInput').addEventListener('input', updateEmojiPreview);
        document.getElementById('textInput').addEventListener('input', updateCardPreview);
        document.getElementById('btnModalCancel').addEventListener('click', closeModal);
        document.getElementById('btnModalSave').addEventListener('click', saveCard);
        document.getElementById('cardsList').addEventListener('click', function(e) {
            var upBtn = e.target.closest('.btn-move-up');
            var downBtn = e.target.closest('.btn-move-down');
            var editBtn = e.target.closest('.btn-edit-card');
            var deleteBtn = e.target.closest('.btn-delete-card');
            if (upBtn) moveCard(upBtn.dataset.cardId, 'up');
            if (downBtn) moveCard(downBtn.dataset.cardId, 'down');
            if (editBtn) openModal(editBtn.dataset.cardId);
            if (deleteBtn) deleteCard(deleteBtn.dataset.cardId);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initToggle();
            renderCards();
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        var _confirmCb = null;
        function showConfirm(msg, onOk) {
            document.getElementById('confirmMsg').textContent = msg;
            _confirmCb = onOk;
            document.getElementById('confirmModal').classList.add('visible');
        }
        document.getElementById('confirmCancel').addEventListener('click', function() {
            document.getElementById('confirmModal').classList.remove('visible');
            _confirmCb = null;
        });
        document.getElementById('confirmOk').addEventListener('click', function() {
            document.getElementById('confirmModal').classList.remove('visible');
            if (_confirmCb) { _confirmCb(); _confirmCb = null; }
        });
    </script>
    <script src="nora-scroll.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
